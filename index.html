<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PegazusLog - Controle de Pacotes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
body { margin:0; font-family: Arial,sans-serif; background:#f2f2f2; height:100vh; display:flex; }

/* Login */
.login-container { width:100%; display:flex; align-items:center; justify-content:center; }
.login-box { width:320px; background:white; padding:25px; border-radius:10px; box-shadow:0 0 15px rgba(0,0,0,0.18); text-align:center; }
.login-box h1 { margin-bottom:15px; font-size:24px; }
.login-box input { width:100%; margin-top:10px; padding:10px; border-radius:6px; border:1px solid #ccc; }
.login-btn { width:100%; margin-top:15px; padding:12px; background:#003a73; color:white; border:none; border-radius:6px; cursor:pointer; }

/* Sidebar */
.sidebar { width:230px; background:#003a73; color:white; padding:15px 10px; display:flex; flex-direction:column; display:none; }
.sidebar h2 { text-align:center; margin-bottom:25px; font-size:18px; }
.nav-btn { background: rgba(255,255,255,0.15); padding:12px; border-radius:6px; margin-bottom:8px; cursor:pointer; text-align:center; font-size:15px; transition:0.2s; }
.nav-btn:hover { background: rgba(255,255,255,0.28); }

/* Main app */
#app { flex:1; padding:15px; display:flex; flex-direction:column; overflow-y:auto; position:relative; }
.hidden { display:none; }

/* Camera Scanner */
#cameraContainer {
    display:none;
    justify-content:center;
    align-items:center;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.85);
    z-index:1000;
    flex-direction:column;
}
#qr-reader {
    width:8cm; 
    height:8cm; 
    position:relative; 
    border:2px solid white; 
    box-sizing:border-box;
}
#scanner-line {
    position:absolute; top:0; left:0; width:100%; height:2px; background:red;
    animation: scanmove 2s infinite linear;
}
@keyframes scanmove { 0% { top:0; } 50% { top:calc(100% - 2px); } 100% { top:0; } }
#qrFeedback {
    position:absolute;
    bottom:100px;
    color:white;
    font-size:20px;
    background:rgba(0,0,0,0.6);
    padding:10px 20px;
    border-radius:8px;
    display:none;
    text-align:center;
}

/* Botão Voltar */
#btnBack {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    width:90%; max-width:400px;
    padding:12px; background:#003a73; color:white; border:none; border-radius:6px;
    cursor:pointer; font-size:16px; display:none; z-index:1001;
}
</style>
</head>
<body>

<!-- Login -->
<div class="login-container" id="loginContainer">
    <div class="login-box">
        <h1>PegazusLog</h1>
        <input id="loginUser" placeholder="Usuário">
        <input id="loginPass" type="password" placeholder="Senha">
        <button id="loginBtn" class="login-btn">Entrar</button>
        <div id="feedbackMessage" style="margin-top:10px;color:#c00;font-size:14px;"></div>
    </div>
</div>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
    <h2>PEGZUS LOG</h2>
    <div id="btnDeliveries" class="nav-btn">📦 Entregas</div>
    <div id="btnCamera" class="nav-btn">📷 Câmera</div>
    <div id="btnMap" class="nav-btn">🗺️ Mapa</div>
    <div id="btnRoute" class="nav-btn">🚗 Rota</div>
    <div id="btnManageUsers" class="nav-btn">👥 Usuários</div>
    <div id="btnGenerateCSV" class="nav-btn">📄 Gerar CSV</div>
    <div id="btnSair" class="nav-btn">🔙 Sair</div>
</div>

<!-- App -->
<div id="app">
    <div id="cameraContainer">
        <div id="qr-reader">
            <div id="scanner-line"></div>
        </div>
        <div id="qrFeedback"></div>
    </div>
</div>

<button id="btnBack">🔙 Voltar</button>

<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
