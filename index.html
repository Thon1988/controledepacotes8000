<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegazus Logística - Sistema de Rastreio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --primary: #1F2937; /* Cinza Escuro */
            --secondary: #374151; /* Cinza Médio */
            --accent: #3b82f6; /* Azul Claro */
            --success: #22c55e; /* Verde */
            --danger: #ef4444; /* Vermelho */
            --background: #f3f4f6; /* Fundo Leve */
            --content-bg: #ffffff; /* Fundo de Conteúdo */
            --content-bg-light: #f9fafb; /* Fundo de Card Claro */
            --content-card-bg: #fff;
            --content-text-dark: #374151;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--content-text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 📱 Layout Principal */
        .app-container {
            width: 100%;
            max-width: 1400px; /* Limite de largura para telas grandes */
            height: 100vh;
            display: grid;
            /* Definição padrão: 392px para sidebar (tablet/desktop) e 1fr para conteúdo */
            grid-template-columns: 392px 1fr; 
            overflow: hidden;
            background: var(--background);
        }

        /* Oculta a barra lateral e maximiza o conteúdo (usado no modo mapa/scanner) */
        .app-container[style*="grid-template-columns: 1fr"] #sidebar {
            display: none;
        }

        /* 🚪 Login */
        .login-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 40px;
            background: var(--content-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 400px;
        }
        
        /* ⚙️ Sidebar */
        .sidebar {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            position: relative;
            z-index: 10;
        }
        
        .logo { font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align: center; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--secondary);
        }
        
        .menu-item span { margin-left: 10px; }

        /* 🖥️ Área de Conteúdo */
        .content-area {
            padding: 20px;
            overflow-y: auto;
            background: var(--background);
        }

        /* 📷 Scanner */
        .camera-view {
            display: none; /* Controlado por JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            max-width: 500px;
            max-height: 500px;
            border: 4px dashed rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        #feedbackMsg {
            position: absolute;
            bottom: 60px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        /* ✏️ Entrada Manual */
        #manualInputContainer {
            position: absolute;
            bottom: 120px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none; /* Controlado pelo JS */
            transition: opacity 0.3s;
            z-index: 99;
        }

        #manualInputContainer input {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 📱 Layout Responsivo e Utilitários */
        .hidden { display: none !important; }
        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            background: #2563eb; 
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .user-form-card {
            background: var(--content-card-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        /* Menu Mobile */
        .mobile-menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        /* Mobile: Menu lateral escondido por padrão */
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: fixed;
                width: 70%;
                height: 100%;
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .content-area {
                padding-top: 60px; /* Espaço para o botão do menu */
            }
            /* Garante que o grid de coluna única permaneça em mobile */
            .app-container[style*="grid-template-columns: 1fr"] {
                grid-template-columns: 1fr !important;
            }
        }
        
        /* ⚙️ Opções do Scanner */
        .scanner-options {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        .scanner-options select {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            width: auto;
            margin: 0;
            cursor: pointer;
        }
        
        /* 🚨 Botão Lápis/Manual */
        #btnToggleManualInput {
            background: var(--accent);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: none;
            transition: background 0.2s;
        }
        
    </style>
</head>
<body>

    <button id="mobileMenuBtn" class="mobile-menu-btn hidden" onclick="toggleSidebar()">☰</button>

    <section id="loginSection" class="login-section">
        <h1 style="text-align:center; color:var(--primary);">PEGASUS</h1>
        <h2 style="text-align:center; margin-top:-10px; font-size:18px; color:var(--content-text-dark);">Login do Entregador</h2>
        <input type="text" id="loginUser" placeholder="Usuário" value="thon">
        <input type="password" id="loginPass" placeholder="Senha" value="882010">
        <button id="btnLogin" class="btn-primary">Entrar</button>
        <p id="loginError" style="color:var(--danger); text-align:center; font-size:14px;"></p>
    </section>

    <div id="appContainer" class="app-container hidden">

        <aside id="sidebar" class="sidebar">
            <div class="menu-top">
                <div class="logo">PEGASUS LOGÍSTICA</div>
                
                <div id="menuSection">
                    <div id="btnDashboard" class="menu-item active">
                        <span role="img" aria-label="Dashboard">📊</span>
                        <span>Dashboard</span>
                    </div>
                    <div id="btnScanMode" class="menu-item">
                        <span role="img" aria-label="Scanner">📸</span>
                        <span>Scanner (Baixa)</span>
                    </div>
                    <div id="btnMap" class="menu-item">
                        <span role="img" aria-label="Map">🗺️</span>
                        <span>Mapa de Entregas</span>
                    </div>
                    <div id="btnRoutes" class="menu-item">
                        <span role="img" aria-label="Routes">🧭</span>
                        <span>Rotas Otimizadas</span>
                    </div>
                    
                    <hr style="border-color: rgba(255, 255, 255, 0.1); margin: 15px 0;">

                    <div id="adminMenuOptions" class="hidden">
                        <div id="btnUsers" class="menu-item">
                            <span role="img" aria-label="Users">👥</span>
                            <span>Gerenciar Usuários</span>
                        </div>
                        <div id="btnExport" class="menu-item">
                            <span role="img" aria-label="Export">📤</span>
                            <span>Exportar Dados (CSV)</span>
                        </div>
                        <div id="exportOptions" style="display:none; flex-direction:column; padding-left:20px; gap:5px; margin-top:5px;">
                            <button id="btnExportDaily" style="background:#4b5563; color:white; padding:8px; border-radius:6px; font-size:14px; box-shadow:none;">Diário</button>
                            <button id="btnExportWeekly" style="background:#4b5563; color:white; padding:8px; border-radius:6px; font-size:14px; box-shadow:none;">Semanal</button>
                            <button id="btnExportMonthly" style="background:#4b5563; color:white; padding:8px; border-radius:6px; font-size:14px; box-shadow:none;">Mensal</button>
                            <button id="btnExportAll" style="background:#6b7280; color:white; padding:8px; border-radius:6px; font-size:14px; box-shadow:none;">Todos os Dados</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="menu-bottom">
                <p style="font-size:14px; color:#9ca3af;">Logado como: <span id="displayUser" style="font-weight:bold;"></span></p>
                <button id="btnLogout" class="btn-primary" style="width:100%; margin-top:10px; background:var(--danger); box-shadow:none;">
                    Sair
                </button>
            </div>
        </aside>

        <main id="contentArea" class="content-area">
            <div style="text-align:center;margin-top:20vh;opacity:0.5; color:var(--content-text-dark)">
                <h2>Bem-vindo! Selecione uma opção no menu.</h2>
            </div>
        </main>

        <div id="cameraView" class="camera-view">
            <video id="videoElement" autoplay playsinline></video>
            
            <div class="scan-overlay"></div>
            
            <p id="feedbackMsg">Pronto para escanear.</p>

            <div class="scanner-options">
                <select id="cameraSelect">
                    <option value="">Carregando Câmeras...</option>
                </select>
                
                <button id="btnToggleManualInput" title="Entrada Manual">
                    ✏️
                </button>
            </div>
            
            <div id="manualInputContainer">
                <input type="text" id="manualDeliveryId" placeholder="ID de Entrega (Ex: BR123456789)" required>
                <button id="btnManualConfirm" class="btn-primary">Confirmar ID Manual</button>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20n6c6P3l5K8s/4mKqEwB8A6pP6A4m/zB5l8xJtA4p8="
        crossorigin=""></script>
        
    <script src="app.js"></script>

</body>
</html>
