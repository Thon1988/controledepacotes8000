<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pegazus Log</title>
  <style>
    body { margin:0; font-family: Arial; background:#f0f0f0; }
    #sidebar { display:none; position:fixed; left:0; top:0; width:260px; height:100%; background:#222; color:#fff; padding:20px; }
    #sidebar.open { display:block; }
    #menuBtn { display:none; position:fixed; left:15px; top:15px; background:#222; color:#fff; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; }
    #loginScreen { display:flex; flex-direction:column; gap:10px; width:280px; margin:80px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .logged-in #loginScreen { display:none; }
    .logged-in #menuBtn { display:block; }
    #scannerContainer { margin-top:80px; text-align:center; }
    #videoElement { width:80%; max-width:380px; border-radius:8px; }
    #overlay { position:absolute; left:0; right:0; margin:auto; }
  </style>
</head>
<body>

<button id="menuBtn">☰ Menu</button>

<div id="sidebar">
  <h2>Menu</h2>
  <button onclick="abrirCamera()">📷 Abrir Câmera</button><br><br>
  <button onclick="listarEntregas()">📦 Entregas</button><br><br>
  <button onclick="openMapa()">📍 Mapa</button><br><br>
  <button onclick="gerarRota()">🧭 Gerar Rota</button><br><br>
  <button id="exportBtn">📄 Gerar CSV</button><br><br>
  <button onclick="pesquisarQRCode()">🔎 Pesquisar QR</button><br><br>
  <button onclick="logout()">🚪 Sair</button>
</div>

<div id="loginScreen">
  <h2>Login</h2>
  <input id="loginUser" placeholder="Usuário" />
  <input id="loginPass" placeholder="Senha" type="password" />
  <button id="loginBtn">Entrar</button>
  <div id="feedbackMessage" style="color:red"></div>
</div>

<div id="scannerContainer">
  <video id="videoElement" autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="scansList" style="margin-top:20px; font-size:18px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="app.js"></script>
</body>
</html>
