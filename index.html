<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PegazusLog</title>

  <style>
    :root {
      --bg: #0d0d0d;
      --card: #ffffff;
      --accent: #00b4d8;
      --text: #ffffff;
      --muted: #9aa0a6;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Arial;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      font-size: 22px;
    }

    /* LOGIN */
    #loginBox {
      max-width: 360px;
      margin: 50px auto;
      background: #111;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    #loginBox input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #222;
      color: #fff;
    }

    #loginBox button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    /* APP */
    #app {
      display: none;
      padding: 12px;
      max-width: 900px;
      margin: auto;
    }

    .cameraWrap {
      margin-top: 16px;
      position: relative;
      width: 40vw;
      height: 40vw;
      max-width: 360px;
      max-height: 360px;
      margin-left: auto;
      margin-right: auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
    }

    .scanLine {
      position: absolute;
      width: 100%;
      height: 3px;
      background: var(--accent);
      top: 0;
      left: 0;
      animation: scan 2.2s infinite alternate ease-in-out;
    }

    @keyframes scan {
      from { top: 0; }
      to { top: calc(100% - 3px); }
    }

    #logBox {
      background: #fff;
      color: #111;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      max-height: 180px;
      overflow-y: auto;
    }

    .item {
      padding: 6px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <h1>PegazusLog</h1>

  <!-- LOGIN -->
  <div id="loginBox">
    <input id="userInput" type="text" placeholder="Usuário">
    <input id="passInput" type="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg" style="margin-top:10px;color:#f55"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="cameraWrap">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="scanLine"></div>
    </div>

    <div id="logBox"></div>
  </div>

  <script src="app.js"></script>

</body>
</html>
