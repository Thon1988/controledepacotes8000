<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegazus Logística - Sistema de Rastreio</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
        
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --primary: #1F2937; /* Cinza Escuro */
            --secondary: #374151; /* Cinza Médio */
            --accent: #3b82f6; /* Azul Claro */
            --success: #22c55e; /* Verde */
            --danger: #ef4444; /* Vermelho */
            --background: #f3f4f6; /* Fundo Leve */
            --content-bg: #ffffff; /* Fundo de Conteúdo */
            --content-bg-light: #f9fafb; /* Fundo de Card Claro */
            --content-card-bg: #fff;
            --content-text-dark: #374151;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--content-text-dark);
            margin: 0;
            padding: 0;
            /* Centraliza a tela de login inicialmente */
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 📱 Layout Principal CLÁSSICO (Desktop/Tablet) */
        .app-container {
            width: 100%;
            max-width: 1400px; /* Limite de largura para telas grandes */
            min-height: 100vh;
            display: flex; /* Novo: Usa Flexbox para sidebar e conteúdo */
            overflow: hidden;
            background: var(--background);
            margin: 0 auto; /* Centraliza o container principal */
        }
        
        /* Ajuste para quando o login sumir, o appContainer ocupar a tela toda */
        #appContainer:not(.hidden) {
            position: absolute; /* Para sobrescrever a centralização do body */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100vh;
            width: 100vw;
            max-width: none;
        }

        /* 🚪 Login */
        .login-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 40px;
            background: var(--content-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 90%;
            max-width: 400px;
        }
        
        /* ⚙️ Sidebar */
        .sidebar {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            position: relative;
            z-index: 10;
            width: 392px; /* Largura fixa para a sidebar em desktop */
            flex-shrink: 0; /* Impede que a sidebar diminua */
        }
        
        .logo { font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align: center; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin: 5px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 16px;
        }

        .menu-item:hover, .menu-item.active {
            background: var(--secondary);
        }
        
        .menu-item span { margin-left: 10px; }

        /* Sub-menu de Exportação */
        #exportOptions {
            display: none; /* Controlado por JS */
            flex-direction: column;
            padding-left: 20px;
            margin-bottom: 10px;
        }

        #exportOptions button {
            margin: 5px 0;
            padding: 8px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        #exportOptions button:hover {
            background: #4b5563;
        }

        /* 🖥️ Área de Conteúdo */
        .content-area {
            padding: 20px;
            overflow-y: auto;
            background: var(--background);
            flex-grow: 1; /* Permite que o conteúdo preencha o espaço restante */
        }

        /* 📷 Scanner - Posicionamento em Tela Cheia */
        .camera-view {
            display: none; /* Controlado por JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100vw; /* Ocupa a largura total */
            height: 100vh; /* Ocupa a altura total */
            position: fixed; /* Fixa sobre tudo */
            top: 0;
            left: 0;
            z-index: 1000; /* Garante que fique acima de todos os outros elementos */
        }
        
        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            max-width: 500px;
            max-height: 500px;
            border: 4px dashed rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            pointer-events: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        #feedbackMsg {
            position: absolute;
            bottom: 60px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        /* ✏️ Entrada Manual */
        #manualInputContainer {
            position: absolute;
            bottom: 120px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 99;
        }

        #manualInputContainer input {
            background: #333;
            border: 1px solid #555;
            color: white;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        /* 📱 Layout Responsivo e Utilitários */
        .hidden { display: none !important; }
        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            background: #2563eb; 
        }

        input[type="text"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .user-form-card {
            background: var(--content-card-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        /* Menu Mobile */
        .mobile-menu-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: var(--primary);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        /* Mobile: Menu lateral escondido por padrão */
        @media (max-width: 768px) {
            .app-container {
                /* Em mobile, a barra lateral é escondida e o conteúdo ocupa tudo */
                display: block; 
                width: 100vw;
            }
            .sidebar {
                position: fixed;
                width: 70%;
                height: 100%;
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
                z-index: 50; /* Z-index alto para ficar sobre o conteúdo */
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .content-area {
                padding-top: 60px; /* Espaço para o botão do menu */
            }
        }
        
        /* ⚙️ Opções do Scanner (Posicionamento dentro da view da Câmera) */
        .scanner-options {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
        }

        .scanner-options select, .scanner-options button {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        .scanner-options select {
            background: white;
            color: var(--primary);
        }
        
        .scanner-options .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: none;
            padding: 8px 12px;
        }
        
        /* Estilos do Leaflet para os marcadores personalizados */
        .custom-marker {
            /* Adicione estilos específicos se necessário */
        }
    </style>
</head>
<body>

    <div id="cameraView" class="camera-view">
        <video id="videoElement" playsinline></video>
        
        <div class="scan-overlay"></div>
        
        <div id="feedbackMsg">Aguardando código...</div>

        <div class="scanner-options">
            <select id="cameraSelect">
                <option value="">Câmera Padrão</option>
            </select>
            <button id="btnToggleManualInput" class="btn-primary">✏️ Entrada Manual</button>
        </div>
        
        <div id="manualInputContainer">
            <input type="text" id="manualDeliveryId" placeholder="ID da Entrega/Coleta (BR...)" autocomplete="off">
            <button id="btnManualConfirm" class="btn-primary" style="background:var(--success);">Confirmar ID</button>
        </div>
    </div>

    <div id="loginSection" class="login-section">
        <h1 style="color:var(--primary); text-align:center;">Pegazus Logística</h1>
        <h3 style="text-align:center; color: var(--accent);">Login do Entregador</h3>
        <input type="text" id="loginUser" placeholder="Usuário" value="thon">
        <input type="password" id="loginPass" placeholder="Senha" value="882010">
        <p id="loginError" style="color:var(--danger); text-align:center; margin:0;"></p>
        <button id="btnLogin" class="btn-primary">Entrar</button>
    </div>

    <button id="mobileMenuBtn" class="mobile-menu-btn hidden">☰</button>
    
    <div id="appContainer" class="app-container hidden">
        <aside id="sidebar" class="sidebar">
            <div>
                <div class="logo">PegazusLog</div>
                <p style="margin: 0 0 20px 0; padding-bottom: 10px; border-bottom: 1px solid var(--secondary);">
                    Usuário: <strong id="displayUser"></strong>
                </p>

                <nav>
                    <div id="btnDashboard" class="menu-item active">
                        <span>🏠 Dashboard</span>
                    </div>
                    <div id="btnScanMode" class="menu-item">
                        <span>📸 Escanear QR/Código</span>
                    </div>
                    <div id="btnMap" class="menu-item">
                        <span>🗺️ Mapa de Entregas</span>
                    </div>
                    <div id="btnRoutes" class="menu-item">
                        <span>🧭 Minhas Rotas</span>
                    </div>
                    
                    <div id="adminMenuOptions" class="hidden">
                        <hr style="border-color: var(--secondary); margin: 15px 0;">
                        <p style="font-weight: bold; margin-bottom: 5px;">Área Admin:</p>
                        <div id="btnUsers" class="menu-item">
                            <span>👥 Gerenciar Usuários</span>
                        </div>
                    </div>

                    <div id="btnExport" class="menu-item">
                        <span>📤 Exportar Dados (Admin)</span>
                    </div>
                    <div id="exportOptions">
                        <button id="btnExportDaily">Diário</button>
                        <button id="btnExportWeekly">Semanal</button>
                        <button id="btnExportMonthly">Mensal</button>
                        <button id="btnExportAll">Todos</button>
                    </div>
                </nav>
            </div>
            
            <button id="btnLogout" class="btn-primary" style="background:var(--danger); width:100%; margin-top:20px;">
                Sair
            </button>
        </aside>

        <main id="contentArea" class="content-area">
            </main>
    </div>
