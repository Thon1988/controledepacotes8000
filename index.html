<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PegazusLog beta v1.0 - Mock Local</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --bg-color: #f0f2f5;
            --list-bg-color: #ffffff;
            --accent-blue-gray: #e9ecef;
            --border-color: #dee2e6;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-color); }

        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }

        .login-box input, .login-box button { width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; }

        #sidebar {
            width: 230px; position: absolute; left: 0; top: 0; bottom: 0; background: white;
            padding: 10px; box-shadow: 3px 0 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }

        #sidebar button { margin: 6px 0; padding: 12px; font-size: 16px; cursor: pointer; }

        #map, #deliveriesList, #userManagementView { display: none; padding: 15px; height: 100%; overflow-y: auto; }

        .delivery-item { background: white; padding: 15px; margin-bottom: 10px; border-left: 4px solid #007bff; border-radius: 8px; }

        #userManagementView table { width: 100%; border-collapse: collapse; background: white; }
        #userManagementView th, #userManagementView td {
            padding: 10px; border: 1px solid #ccc; text-align: left;
        }
    </style>
</head>

<body>

<div class="login-container">
    <div class="login-box">
        <h2 style="text-align:center;">PegazusLog</h2>

        <input type="text" id="loginUser" placeholder="Usuário" />
        <input type="password" id="loginPass" placeholder="Senha" />
        <button id="loginBtn">Entrar</button>

        <button id="resetMockBtn" style="background:#6c757d; color:white;">
            Resetar Banco Local (Mock)
        </button>

        <p id="feedbackMessage" style="color:red; margin-top:10px;"></p>
    </div>
</div>

<div id="app" style="display:none; height:100vh;">

    <div id="sidebar">
        <button id="btnCamera">📷 Câmera</button>
        <button id="btnDeliveries">📦 Entregas (0)</button>
        <button id="btnMap">🗺️ Mapa</button>
        <button id="btnRoute">🚗 Rota</button>
        <button id="btnManageUsers">👥 Usuários</button>
        <button id="btnSair" class="backBtn" style="background:#dc3545; color:white;">Sair</button>
    </div>

    <div class="view-container" style="margin-left:230px; height:100%;">

        <div id="map" style="height:100%;"></div>

        <div id="deliveriesList"></div>

        <div id="userManagementView">
            <h2>Criar Usuário</h2>

            <input type="text" id="newUsername" placeholder="Nome" />
            <input type="password" id="newPassword" placeholder="Senha" />

            <select id="newUserRole">
                <option value="gestor">gestor</option>
                <option value="colaborador">colaborador</option>
                <option value="admin">admin</option>
            </select>

            <button id="createUserBtn" style="background:#28a745; color:white;">Criar Usuário</button>

            <p id="userFeedbackMessage"></p>

            <hr>

            <h2>Usuários</h2>
            <table>
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Função</th>
                        <th>Criado Por</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <div id="cameraContainer" style="display:none;">
            <h1>Função câmera mock</h1>
        </div>

    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
