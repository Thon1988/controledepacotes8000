<!-- PegazusLog v1.0 – Versão Premium (C) com interface moderna azul/cinza -->
<!-- HTML + CSS integrados -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>PegazusLog v1.0</title>

    <!-- Manifesto PWA -->
    <link rel="manifest" href="manifest.json" />

    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --bg: #f1f4f9;
            --white: #ffffff;
            --gray: #e3e7ee;
            --dark-text: #2a2d34;
            --light-text: #6c757d;
            --border: #d0d4dd;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--dark-text);
        }

        /* TELA DE LOGIN */
        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .login-box {
            width: 330px;
            padding: 35px;
            border-radius: 14px;
            background: var(--white);
            text-align: center;
            box-shadow: 0 8px 18px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            margin-bottom: 15px;
            color: var(--primary);
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }

        .login-box button:hover {
            background: var(--primary-dark);
        }

        #app {
            display: none;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background: var(--white);
            height: 100%;
            position: fixed;
            left: 0;
            top: 0;
            padding: 15px;
            box-shadow: 3px 0 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar button {
            background: var(--primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar button:hover {
            background: var(--primary-dark);
        }

        /* VISÕES */
        .view {
            margin-left: 250px;
            height: 100%;
            width: calc(100vw - 250px);
            display: none;
            background: var(--bg);
        }

        /* CAMERA – Estilo Premium */
        #cameraView {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: black;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-frame {
            position: absolute;
            width: 65%;
            aspect-ratio: 1/1;
            border: 4px solid var(--primary);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 123, 255, 0.5);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #00c3ff;
            animation: scan 2s infinite alternate;
            box-shadow: 0 0 12px #00c3ff;
        }

        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* MAPA */
        #mapView {
            display: none;
        }

        #map {
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h1>PegazusLog v1.0</h1>
        <input type="text" id="loginUser" placeholder="Usuário" />
        <input type="password" id="loginPass" placeholder="Senha" />
        <button id="loginBtn">Entrar</button>
        <p id="feedbackMessage" style="color:red;"></p>
    </div>
</div>

<div id="app">
    <div class="sidebar">
        <button id="btnCamera">📷 Câmera</button>
        <button id="btnDeliveries">📦 Entregas</button>
        <button id="btnMap">🗺️ Mapa</button>
        <button id="btnUsers">👥 Usuários</button>
        <button id="btnLogout" style="background:#dc3545">Sair</button>
    </div>

    <div class="view" id="cameraView">
        <video id="videoElement" autoplay playsinline></video>
        <div class="scanner-frame">
            <div class="scan-line"></div>
        </div>
    </div>

    <div class="view" id="mapView">
        <div id="map"></div>
    </div>

    <div class="view" id="deliveriesView"></div>

    <div class="view" id="usersView"></div>
</div>

<script>
// LOGIN SIMPLES
const loginBtn = document.getElementById("loginBtn");
loginBtn.onclick = () => {
    const user = loginUser.value;
    const pass = loginPass.value;

    if (user === "thon" && pass === "882010") {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("app").style.display = "block";
    } else {
        feedbackMessage.textContent = "Credenciais inválidas";
    }
};

// TROCA DE TELAS
function show(viewId) {
    document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
    document.getElementById(viewId).style.display = 'block';
}

btnCamera.onclick = () => show('cameraView');
btnDeliveries.onclick = () => show('deliveriesView');
btnMap.onclick = () => show('mapView');
btnUsers.onclick = () => show('usersView');

// LOGOUT
btnLogout.onclick = () => location.reload();
</script>

</body>
</html>
