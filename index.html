<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PegazusLog — Scanner Integrado</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <script src="app.js" defer></script> 

  <style>
    /* --- VARIÁVEIS DE COR PADRÃO (TEMA CLARO - DEFAULT) --- */
    :root {
      /* Base - Sidebar Dark / Conteúdo Light */
      --bg: #0f172a; /* Fundo principal (body) - Azul escuro */
      --panel: rgba(30, 41, 59, 0.95); /* Sidebar/Login (Slate 800) */
      --text: #f1f5f9; /* Texto claro (para sidebar) */
      --muted: #94a3b8; /* Cinza claro (para sidebar) */
      
      /* Conteúdo Light */
      --content-bg: #f8fafc; /* Fundo do Conteúdo (Screen) */
      --content-card-bg: #ffffff; /* Fundo dos Cards */
      --content-text: #0f172a; /* Texto escuro */
      --content-text-dark: #334155; /* Texto cinza escuro */

      /* Ações */
      --primary: #3b82f6; /* Azul (Botão principal) */
      --secondary: #64748b; /* Cinza (Botão secundário) */
      --accent: #06b6d4; /* Ciano (Destaque) */
      --success: #22c55e; /* Verde */
      --warning: #facc15; /* Amarelo */
      --danger: #ef4444; /* Vermelho */
    }

    /* --- ESTILOS GLOBAIS --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden; /* Evita scroll desnecessário no body */
    }

    /* --- ESTILOS DE LOGIN --- */
    #loginSection {
      background: var(--panel);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

    #loginSection h1 {
      color: var(--accent);
      margin-bottom: 20px;
    }

    #loginSection input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid var(--muted);
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 16px;
    }

    #loginSection input::placeholder {
      color: var(--muted);
    }
    
    .hidden {
      display: none !important;
    }

    /* --- ESTILOS DA APLICAÇÃO PRINCIPAL --- */
    .app {
      display: none; /* Controlado pelo JS */
      grid-template-columns: 320px 1fr;
      width: 100vw;
      height: 100vh;
      overflow: hidden; 
    }
    
    .main {
        padding: 20px;
        background-color: var(--content-bg);
        color: var(--content-text);
        overflow-y: auto; /* Scroll apenas no main content */
        max-height: 100vh;
    }

    .main h2 {
        color: var(--primary);
        margin-bottom: 10px;
    }

    /* --- SIDEBAR (MENU) --- */
    .sidebar {
      background-color: var(--panel);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      min-width: 320px;
      max-width: 320px;
      z-index: 10;
      height: 100vh;
    }

    .sidebar-header {
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-menu {
      flex-grow: 1;
      padding-top: 20px;
    }

    .sidebar-footer {
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .user-info {
        font-size: 14px;
        color: var(--muted);
    }
    
    .menu-item {
      padding: 12px 10px;
      margin-bottom: 5px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.2s;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .export-container {
        display: block;
    }

    #exportOptions {
        display: none; /* Escondido por padrão, toggle pelo JS */
        flex-direction: column;
        gap: 5px;
        padding: 10px 0 5px 20px;
        margin-top: 5px;
        border-left: 3px solid var(--accent);
    }

    #exportOptions button {
        background: rgba(6, 182, 212, 0.2);
        color: var(--text);
        border: none;
        padding: 8px 10px;
        border-radius: 6px;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s;
    }
    
    #exportOptions button:hover {
        background: rgba(6, 182, 212, 0.4);
    }


    /* --- BOTÕES GERAIS --- */
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    button:hover {
        opacity: 0.9;
    }
    
    button:active {
        transform: translateY(1px);
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-secondary {
      background-color: var(--secondary);
      color: white;
    }
    
    /* --- CÂMERA E SCANNER --- */
    #cameraView {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: black;
      display: none; /* Escondido por padrão, é o modo SCAN */
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    #videoElement {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-overlay {
      position: absolute;
      width: 80vw;
      height: 80vw;
      max-width: 400px;
      max-height: 400px;
      border: 5px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      pointer-events: none;
      transition: border-color 0.3s;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5) inset;
    }
    
    .camera-controls {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 15px;
        z-index: 100;
        width: 90%;
        max-width: 400px;
    }
    
    .camera-controls > div {
        display: flex;
        gap: 10px;
    }
    
    .camera-controls button, .camera-controls select {
        padding: 10px;
        border-radius: 8px;
        background-color: rgba(30, 41, 59, 0.8);
        color: white;
        font-weight: bold;
        flex: 1;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        border: none;
    }

    .camera-controls button:first-child {
        background-color: var(--danger);
        width: 100%;
    }
    
    #cameraSelect {
        flex: 2;
    }
    
    #btnTorch {
        flex: 1;
        background-color: var(--accent) !important;
    }

    #feedbackMsg {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--success);
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
        z-index: 101;
        opacity: 0;
        transition: opacity 0.3s;
        max-width: 80%;
        text-align: center;
    }
    
    /* --- ESTILOS DE MAPA/LISTA DE USUÁRIOS --- */
    .user-form-card {
        background: var(--content-card-bg); 
        padding:15px; 
        border-radius:10px; 
        border:1px solid var(--muted); 
        margin-bottom: 10px;
    }

    .user-form-card input, .user-form-card select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--muted);
        margin-bottom: 10px;
        background: var(--content-bg);
        color: var(--content-text);
    }
    
    /* --- RESPONSIVIDADE (MOBILE) --- */
    #mobileMenuBtn {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 20;
        background-color: var(--primary);
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 20px;
        display: none; /* Escondido por padrão, só aparece no mobile */
    }

    @media (max-width: 768px) {
        .app {
            grid-template-columns: 1fr;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 80vw;
            max-width: none;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.3);
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .main {
            padding-top: 60px; /* Espaço para o botão de menu */
        }
        
        #mobileMenuBtn {
            display: block;
        }
        
        .camera-controls {
            bottom: 60px;
        }
        
    }
  </style>
</head>
<body>

  <button id="mobileMenuBtn" class="hidden" onclick="window.toggleSidebar()">☰</button>

  <section id="loginSection">
    <h1>PegazusLog</h1>
    <p style="color:var(--muted); margin-bottom: 20px;">Acesso ao Sistema</p>
    <input type="text" id="loginUser" placeholder="Usuário" value="thon">
    <input type="password" id="loginPass" placeholder="Senha" value="882010">
    <button id="btnLogin" class="btn-primary" style="width: 100%">Entrar</button>
    <p id="loginError" style="color:var(--danger); margin-top: 10px; font-size: 14px;"></p>
  </section>

  <div id="appContainer" class="app hidden">
    
    <aside id="sidebar" class="sidebar">
      <div>
        <div class="sidebar-header">
          <h2 style="color:var(--accent);">PegazusLog</h2>
        </div>

        <div class="sidebar-menu" id="menuSection">
            <div id="btnDashboard" class="menu-item">🏠 Dashboard</div>
            <div id="btnScanMode" class="menu-item">📸 Iniciar Scanner</div>
            <div id="btnMap" class="menu-item">📍 Mapa de Entregas</div>
            <div id="btnRoutes" class="menu-item">🗺️ Rota Otimizada</div>
            
            <div id="adminMenuOptions" class="hidden">
                <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">
                <div id="btnUsers" class="menu-item">👥 Gerenciar Usuários</div>
            </div>

            <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">

            <div class="export-container menu-item">
                <button id="btnExport" style="background:none; border:none; color:inherit; font:inherit; padding:0; display:flex; align-items:center; gap:10px; cursor:pointer;">
                    ⬇️ Exportar Dados
                </button>
                <div id="exportOptions">
                    <button id="btnExportDaily">Últimas 24h</button>
                    <button id="btnExportWeekly">Últimos 7 dias</button>
                    <button id="btnExportMonthly">Últimos 30 dias</button>
                    <button id="btnExportAll">Todos os Dados</button>
                </div>
            </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">Logado como: <strong id="displayUser"></strong></div>
        <button id="btnLogout" class="btn-secondary" style="margin-top:10px; width: 100%">Sair</button>
      </div>
    </aside>

    <main class="main">
      <div id="contentArea">
        </div>
    </main>
  </div>

  <section id="cameraView">
    <video id="videoElement" playsinline></video>
    <div class="scan-overlay"></div>
    <div id="feedbackMsg"></div>
    <div class="camera-controls">
        <button onclick="window.renderDashboard()">✕ Fechar Scanner</button>
        <div>
            <select id="cameraSelect" class="hidden"></select>
            <button id="btnTorch">🔦</button>
        </div>
    </div>
  </section>
  
</body>
</html>
