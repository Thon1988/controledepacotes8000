
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp Completo</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; }
        #loginScreen { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; background: #ffffff; }
        .login-box { width: 320px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; }
        .login-box button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; }

        #app { display: flex; height: 100vh; }
        #sidebar { width: 220px; background: #222; color: white; padding-top: 20px; display: none; flex-direction: column; }
        #sidebar button { background: none; border: none; color: white; padding: 15px; text-align: left; width: 100%; cursor: pointer; }
        #sidebar button:hover { background: #444; }
        #content { flex: 1; background: white; padding: 20px; }

        #scannerContainer { width: 100%; height: calc(100vh - 80px); background: black; display: none; position: relative; }
        #scanArea { width: 300px; height: 300px; border: 3px solid white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #scanLine { width: 100%; height: 3px; background: red; position: absolute; animation: scan 2s linear infinite; }

        @keyframes scan {
            0% { top: 0; }
            100% { top: calc(100% - 3px); }
        }
    </style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="loginScreen">
    <div class="login-box">
        <h2>Login</h2>
        <input id="user" type="text" placeholder="Usuário">
        <input id="pass" type="password" placeholder="Senha">
        <button onclick="login()">Entrar</button>
    </div>
</div>

<!-- APLICAÇÃO -->
<div id="app" style="display:none;">

    <!-- SIDEBAR -->
    <div id="sidebar">
        <button onclick="openHome()">🏠 Início</button>
        <button onclick="openScanner()">📷 Scanner</button>
        <button onclick="openUsers()">👤 Usuários</button>
        <button onclick="logout()">🚪 Sair</button>
    </div>

    <!-- CONTEÚDO -->
    <div id="content">
        <h1>Bem-vindo, selecione uma opção</h1>
        <div id="dynamicContent"></div>
    </div>
</div>

<!-- IMPORTA O JAVASCRIPT -->
<script src="app.js"></script>

</body>
</html>
