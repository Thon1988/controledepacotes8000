<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PegazusLog v0.1</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================ -->
<!--        TELA DE LOGIN         -->
<!-- ============================ -->
<div id="loginContainer" class="login-container">
    <h1 class="logo">PegazusLog v0.1</h1>

    <div class="login-box">
        <input id="loginUser" placeholder="Usuário" type="text" />
        <input id="loginPass" placeholder="Senha" type="password" />
        <button id="loginBtn">Entrar</button>
        <div id="feedbackMessage" class="feedback"></div>
    </div>
</div>

<!-- ============================ -->
<!--        MENU LATERAL          -->
<!-- ============================ -->
<button id="menuBtn" class="menu-button" style="display:none;">☰</button>
<div id="sidebar" class="sidebar" style="display:none;">
    <h2 class="menu-title">Menu</h2>

    <!-- ADMIN -->
    <button class="menu-item menu-admin" onclick="adicionarUsuario('gestor')">Adicionar Gestor</button>
    <button class="menu-item menu-admin" onclick="adicionarUsuario('colab')">Adicionar Colaborador</button>

    <!-- GESTOR -->
    <button class="menu-item menu-gestor" onclick="adicionarUsuario('colab')">Adicionar Colaborador</button>

    <!-- COLAB / TODOS -->
    <button class="menu-item menu-colab" id="openCameraBtn">📷 Abrir Câmera</button>
    <button class="menu-item menu-colab" id="exportBtn">📄 Exportar CSV</button>

    <button class="menu-item" onclick="logout()">🚪 Sair</button>
</div>

<!-- ============================ -->
<!--     ÁREA PRINCIPAL APP      -->
<!-- ============================ -->
<div id="appContent" class="app-content" style="display:none;">

    <!-- Câmera -->
    <div class="camera-box">
        <video id="videoElement" autoplay></video>
        <canvas id="overlay"></canvas>
    </div>

    <!-- Lista de entregas -->
    <div class="entregas-box">
        <h3>Entregas Registradas</h3>
        <div id="scansList">Nenhuma entrega ainda.</div>
    </div>
</div>

<script src="jsQR.js"></script>
<script src="app.js"></script>
</body>
</html>
