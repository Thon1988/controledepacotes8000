<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PegazusLog — Sistema Completo</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <style>
    :root {
      --primary: #1976d2;
      --success: #2e7d32;
      --danger: #c62828;
      --accent: #ffd740;
      --radius: 12px;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    /* ========================
         LOGIN
    =========================*/
    #loginSection {
      max-width: 340px;
      margin: 60px auto;
      text-align: center;
    }

    #loginSection input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: var(--radius);
      border: 1px solid #ccc;
    }

    .btn-primary {
      background: var(--primary);
      padding: 12px;
      width: 100%;
      color: white;
      border-radius: var(--radius);
      border: none;
      margin-top: 12px;
    }

    /* ========================
         LAYOUT PRINCIPAL
    =========================*/
    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #0f172a;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .nav-btn {
      background: rgba(255,255,255,0.1);
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      text-align: left;
      border: none;
      color: white;
      width: 100%;
    }

    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    /* ========================
         LISTA DE ENTREGAS
    =========================*/
    #telaEntregas {
      display: none;
    }

    .entrega-card {
      background: white;
      padding: 15px;
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* ========================
         MODAL GENÉRICO
    =========================*/
    .modal-bg {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.4);
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:200;
    }
    .modal {
      background:white;
      padding:20px;
      border-radius:var(--radius);
      width:90%;
      max-width:420px;
    }

    /* ========================
         USUÁRIOS
    =========================*/
    #telaUsuarios {
      display:none;
    }

    #listaUsuarios {
      display:grid;
      gap:15px;
    }

    @media (min-width:760px){
      #listaUsuarios {
        grid-template-columns: 1fr 1fr;
      }
    }

    .user-card {
      background:white;
      padding:15px;
      border-radius:var(--radius);
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    .user-card button {
      padding:8px 12px;
      border-radius:8px;
      border:none;
      margin-right:10px;
      cursor:pointer;
    }

    .btn-editar { background:#0288d1; color:white }
    .btn-excluir { background:#c62828; color:white }

    /* ========================
         MAPA
    =========================*/
    #mapaView {
      width: 100%;
      height: 70vh;
      border-radius: var(--radius);
      display: none;
    }

  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginSection">
    <h2>PegazusLog</h2>
    <input id="loginUser" type="text" placeholder="Usuário">
    <input id="loginPass" type="password" placeholder="Senha">
    <button id="btnLogin" class="btn-primary">Entrar</button>
    <div id="loginError" style="color:red; margin-top:10px;"></div>
  </div>

  <!-- APP -->
  <div class="app" id="app" style="display:none;">

    <div class="sidebar">

      <div style="background:rgba(255,255,255,0.1); padding:10px; border-radius:8px;">
        Logado como: <strong id="displayUser"></strong>
      </div>

      <button class="nav-btn" id="btnScan">📷 Scanner</button>
      <button class="nav-btn" id="btnEntregas">📦 Lista de Entregas</button>
      <button class="nav-btn" id="btnMap">🗺️ Mapa</button>
      <button class="nav-btn" id="btnCSV">📄 Exportar CSV</button>
      <button class="nav-btn" id="btnUsers">👥 Usuários</button>

      <div style="flex:1"></div>

      <button class="nav-btn" id="btnLogout" style="color:#ff6b6b;">Sair</button>
    </div>

    <div class="main">

      <!-- Tela inicial -->
      <div id="inicio">
        <h2>Bem-vindo</h2>
        <p>Escolha uma opção no menu.</p>
      </div>

      <!-- LISTA DE ENTREGAS -->
      <div id="telaEntregas">
        <h2>Entregas Realizadas</h2>
        <div id="listaEntregas"></div>
      </div>

      <!-- MAPA -->
      <div id="telaMapa" style="display:none;">
        <button id="closeMapa" style="float:right;">❌</button>
        <h2>Mapa</h2>
        <div id="mapaView"></div>
      </div>

      <!-- USUÁRIOS -->
      <div id="telaUsuarios">
        <h2>Gerenciar Usuários</h2>

        <input id="searchUser" placeholder="Buscar..." style="padding:10px; width:100%;">

        <select id="filterRole" style="padding:10px; width:100%; margin-top:8px;">
          <option value="">Todos</option>
          <option value="admin">Admin</option>
          <option value="gestor">Gestor</option>
          <option value="colaborador">Colaborador</option>
        </select>

        <button id="btnNovoUser" class="btn-primary" style="margin-top:10px;">Novo Usuário</button>

        <div id="listaUsuarios"></div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
