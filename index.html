<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PegazusLog - Controle de Pacotes</title>

    <!-- LEAFLET MAP -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            height: 100vh;
        }

        /* ============================ SIDEBAR ============================ */
        .sidebar {
            width: 230px;
            background: #003a73;
            color: white;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.15);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            text-align: center;
            font-size: 15px;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        /* ============================ LOGIN ============================ */
        .login-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 300px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.18);
        }

        .login-box input {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .login-btn {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #003a73;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        /* ======================= MAIN CONTENT ======================== */
        #app {
            flex: 1;
            padding: 15px;
            display: none;
            overflow-y: auto;
        }

        /* ======================= USER MANAGEMENT ====================== */
        #userManagementView{
            display:none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn-small {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            margin-right: 5px;
            cursor: pointer;
        }

        .btn-edit { background: #0088ff; color: white; }
        .btn-delete { background: #cc0000; color: white; }
        .btn-pass { background: #ffaa00; color: white; }

        /* ======================= DELIVERIES ======================== */
        #deliveriesList {
            margin-top: 10px;
        }

        .delivery-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 5px solid #003a73;
        }

        .meta {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        /* ======================= CAMERA ======================== */
        #cameraContainer{
            display:none;
            justify-content:center;
            align-items:center;
            height: 70vh;
            background:#ddd;
        }

        #qrVideo {
            width: 300px;
            height: 300px;
            background: black;
        }

        /* ======================= MAP ======================== */
        #map {
            width: 100%;
            height: 80vh;
            display:none;
        }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>

            <input id="loginUser" placeholder="Usuário">
            <input id="loginPass" type="password" placeholder="Senha">

            <button id="loginBtn" class="login-btn">Entrar</button>

            <div id="feedbackMessage" style="margin-top:10px;color:#c00;font-size:14px;"></div>
        </div>
    </div>

    <!-- APP -->
    <div class="sidebar" id="sidebar" style="display:none;">
        <h2>PEGZUS LOG</h2>
        <div id="btnDeliveries" class="nav-btn">📦 Entregas</div>
        <div id="btnCamera" class="nav-btn">📷 Câmera</div>
        <div id="btnMap" class="nav-btn">🗺️ Mapa</div>
        <div id="btnRoute" class="nav-btn">🚗 Rota</div>
        <div id="btnManageUsers" class="nav-btn">👥 Usuários</div>
        <div id="btnSair" class="nav-btn">🔙 Sair</div>
    </div>

    <div id="app">

        <!-- USER MANAGEMENT -->
        <div id="userManagementView">
            <h2>Gerenciar Usuários</h2>

            <div style="background:white;padding:15px;border-radius:8px;">
                <h3>Criar usuário</h3>

                <input id="newUsername" placeholder="Novo usuário">
                <input id="newPassword" placeholder="Senha">
                <select id="newUserRole">
                    <option value="gestor">Gestor</option>
                    <option value="colaborador">Colaborador</option>
                </select>
                <button id="createUserBtn" class="login-btn" style="margin-top:10px;">Criar</button>
            </div>

            <h3 style="margin-top:25px;">Usuários cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Usuário</th>
                        <th>Função</th>
                        <th>Criado por</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <!-- DELIVERIES -->
        <div id="deliveriesList"></div>

        <!-- CAMERA -->
        <div id="cameraContainer">
            <video id="qrVideo" autoplay></video>
        </div>

        <!-- MAP -->
        <div id="map"></div>
    </div>

    <!-- LIBS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- APP -->
    <script src="app.js"></script>

    <script>
        // Mostrar sidebar após login
        document.addEventListener("DOMContentLoaded", ()=>{
            const session = localStorage.getItem("pegazus_session_v1");
            if(session){
                document.querySelector(".login-container").style.display = "none";
                document.getElementById("sidebar").style.display = "flex";
            }
        });

        document.getElementById("loginBtn").addEventListener("click", ()=>{
            setTimeout(()=>{
                const session = localStorage.getItem("pegazus_session_v1");
                if(session){
                    document.querySelector(".login-container").style.display = "none";
                    document.getElementById("sidebar").style.display = "flex";
                }
            },600);
        });
    </script>

</body>
</html>
