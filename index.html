<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PegazusLog — Scanner Integrado</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <script src="app.js" defer></script> 

  <style>
    /* --- VARIÁVEIS E RESET --- */
    :root{
      --bg:#0f172a; --panel:rgba(30,41,59,0.95); --text:#f1f5f9;
      --content-bg-light:#f4f6f8; --content-card-bg:#fff; --content-text-dark:#1f2937;
      --accent:#38bdf8; --accent-dark:#0ea5e9; --success:#22c55e; --danger:#ef4444;
      --radius:18px; font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    *{box-sizing:border-box}
    body{margin:0; background:linear-gradient(180deg,var(--bg)0%,#000100%); color:var(--content-text-dark); min-height:100vh; display:flex; justify-content:center; align-items:center;}
    .hidden{display:none!important;}

    /* --- APP LAYOUT --- */
    .app{display:grid; grid-template-columns:392px 1fr; width:100vw; height:100vh; background:var(--content-bg-light); overflow:hidden;}
    .sidebar{background:var(--panel); color:var(--text); padding:20px; display:flex; flex-direction:column; gap:8px; z-index:20;}
    .logo{font-size:22px; color:var(--accent); font-weight:700; margin-bottom:8px}
    .menu-item{padding:12px;border-radius:10px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
    .menu-item:hover{background:rgba(56,189,248,0.08); color:var(--accent)}
    .menu-item.active{background:var(--accent); color:var(--panel); font-weight:700}

    .main{padding:22px; overflow:auto; height:100%;}
    .main h2{margin-top:0}
    .user-info{margin-top:auto; font-size:13px; color:var(--text)}
    .btn-primary{background:var(--accent); color:#000; padding:10px 14px; border-radius:10px; border:none; cursor:pointer; font-weight:700;}
    .btn-secondary{background:rgba(255,255,255,0.06); color:var(--text); border:none; padding:8px 12px; border-radius:8px; cursor:pointer}

    /* --- CONTENT AREA LAYOUTS --- */
    .card{background:var(--content-card-bg); padding:12px; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.06); margin-bottom:12px}
    .list-deliveries{display:flex; flex-direction:column; gap:8px}
    .delivery-item{display:flex; gap:12px; align-items:flex-start; padding:10px; border-radius:10px; background:var(--content-card-bg); border:1px solid rgba(0,0,0,0.03)}
    .delivery-item .meta{font-size:12px; color:#6b7280}
    .delivery-item .title{font-weight:700; font-size:14px}

    /* --- MAP / ROUTE OBJECT --- */
    #mapObj, #routeMapObj{height:60vh; border-radius:10px; overflow:hidden}

    /* --- CAMERA VIEW --- */
    #cameraView{position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:1200}
    #videoElement{width:100%; height:100%; object-fit:cover}
    .scan-overlay{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:90vmin; height:90vmin; max-width:400px; max-height:400px; border:4px solid rgba(255,255,255,0.5); border-radius:12px; z-index:1201; transition:border-color .2s}
    .camera-controls{position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; z-index:1202}
    .camera-controls .group{display:flex; gap:8px; align-items:center}
    .camera-controls button{background:rgba(0,0,0,0.45); color:white; border:none; width:44px; height:44px; border-radius:8px; cursor:pointer; font-size:18px}

    /* --- EXPORT OPTIONS --- */
    .export-box{position:relative; display:inline-block}
    #exportOptions{position:absolute; right:0; top:110%; background:var(--content-card-bg); border-radius:10px; padding:10px; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.12); z-index:30}
    #exportOptions input, #exportOptions select{width:220px; padding:8px; margin-bottom:8px; border-radius:6px; border:1px solid #ddd}

    /* --- RESPONSIVE --- */
    @media(max-width:920px){
      .app{grid-template-columns:320px 1fr}
      .logo{font-size:20px}
      #mapObj, #routeMapObj{height:50vh}
    }
    @media(max-width:768px){
      .app{grid-template-columns:1fr}
      .sidebar{position:fixed; left:0; top:0; bottom:0; width:300px; transform:translateX(-320px); transition:transform .25s; z-index:200}
      .sidebar.active{transform:translateX(0)}
      #mobileMenuBtn{position:fixed; top:12px; left:12px; z-index:300; width:44px; height:44px; border-radius:50%; background:var(--accent); color:#000; border:none}
      .main{padding:16px}
      .delivery-item{flex-direction:column; align-items:flex-start}
      #exportOptions{right:10px; left:10px}
    }

    /* small niceties */
    .small-muted{font-size:12px;color:#6b7280}
    .close-x{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--content-text-dark);position:absolute; top:8px; right:8px}
    .flex{display:flex; gap:8px; align-items:center}
    .grow{flex:1}
    .badge{background:rgba(0,0,0,0.04); padding:6px 8px; border-radius:8px; font-size:12px}
  </style>
</head>
<body>

  <button id="mobileMenuBtn" class="hidden" onclick="window.toggleSidebar()">☰</button>

  <section id="loginSection" class="login-container">
    <div class="login-card card" style="max-width:420px;margin:auto;background:var(--panel);color:var(--text);border-radius:14px">
      <h1 style="color:var(--accent);margin-bottom:12px">PegazusLog</h1>
      <input type="text" id="loginUser" placeholder="Usuário" value="thon" style="padding:12px;border-radius:10px;border:none;margin-bottom:8px" />
      <input type="password" id="loginPass" placeholder="Senha" value="882010" style="padding:12px;border-radius:10px;border:none;margin-bottom:8px" />
      <button id="btnLogin" class="btn-primary" style="width:100%;margin-top:6px">Entrar</button>
      <p id="loginError" style="color:var(--danger);margin-top:8px"></p>
    </div>
  </section>

  <div class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="logo">📦 PegazusLog</div>

      <div id="menuSection">
        <div id="btnDashboard" class="menu-item active">🏠 Dashboard</div>
        <div id="btnScanMode" class="menu-item">📷 Iniciar Scanner</div>
        <div id="btnDeliveries" class="menu-item">📋 Lista de Entregas</div>
        <div id="btnMap" class="menu-item">🗺️ Mapa de Entregas</div>
        <div id="btnRoutes" class="menu-item">🧭 Otimizar Rotas</div>
        
        <div id="adminMenuOptions" style="margin-top:12px">
            <hr style="border-color:rgba(255,255,255,0.06); margin:12px 0;">
            <div id="btnUsers" class="menu-item">👥 Usuários</div>
            <div class="export-box menu-item" style="align-items:center">
                <button id="btnExport" style="background:none;border:none;color:inherit;cursor:pointer;padding:0;display:flex;align-items:center;gap:8px">⬇️ Exportar Dados</button>
                <div id="exportOptions">
                    <label class="small-muted">Período</label>
                    <select id="exportPeriod">
                      <option value="daily">Últimas 24h</option>
                      <option value="weekly">Últimos 7 dias</option>
                      <option value="monthly">Últimos 30 dias</option>
                      <option value="all">Todos os Dados</option>
                    </select>
                    <label class="small-muted">Buscar por usuário (login)</label>
                    <input id="exportUserSearch" placeholder="Digite login (opcional)"/>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                      <button id="btnExportRun" class="btn-primary" style="flex:1">Gerar CSV</button>
                    </div>
                </div>
            </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">Logado como: <strong id="displayUser"></strong></div>
        <button id="btnLogout" class="btn-secondary" style="margin-top:10px; width:100%">Sair</button>
      </div>
    </aside>

    <main class="main">
      <div id="contentArea">
        <!-- Conteúdo dinâmico -->
      </div>
    </main>
  </div>

  <section id="cameraView">
    <video id="videoElement" playsinline></video>
    <div class="scan-overlay"></div>

    <div class="camera-controls">
      <div class="group">
        <button id="btnBackFromCamera" title="Fechar (X)">✕</button>
      </div>
      <div class="group">
        <select id="cameraSelect" class="hidden"></select>
        <button id="btnTorch" title="Lanterna">💡</button>
        <button id="btnManualEntry" title="Entrada manual (digitar rastreio)">✏️</button>
      </div>
    </div>

    <div id="feedbackMsg"></div>
  </section>

</body>
</html>
