<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📦 Scanner 8000 v0.1</title>

  <style>
    /* Estilos gerais do corpo da aplicação */
    html,body{
        height:100%;
        margin:0;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
        background:#f4f4f7; /* Fundo claro fixo */
        color:#111; /* Texto preto fixo */
        display: flex; /* Para centralizar o conteúdo do login */
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
    }

    /* Container principal da aplicação (Ocultado quando a tela de login está ativa) */
    .app{
        max-width:920px;
        margin:12px auto;
        padding:12px;
        width: 100%; 
        box-sizing: border-box; 
    }
    
    h1{margin:0 0 8px;font-size:18px;color:#111; text-align: center;} 
    
    .controls{
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:10px;
        align-items:center;
        justify-content: center; 
    }
    button{
        background:#00b4d8;
        color:#fff;
        border:0;
        padding:8px 12px;
        border-radius:8px;
        cursor:pointer;
        font-weight:600;
        transition: background 0.2s ease;
    }
    button:hover {
        background: #0096c7;
    }
    button.secondary{background:#6c757d}
    button.secondary:hover {
        background: #5a6268;
    }
    
    /* Estilo para Inputs/Selects (Alto contraste) */
    .controls input[type="text"], 
    .controls input[type="password"], 
    .controls input[type="date"],
    .controls select {
      padding: 8px; 
      border-radius: 8px; 
      border: 1px solid #ccc; 
      width: auto; 
      color: #111; 
      background-color: #fff; 
      box-sizing: border-box;
    }

    .camera-wrap{
        position:relative;
        max-width:920px;
        margin:0 auto;
        border-radius:12px;
        overflow:hidden;
        background:#000;
        height:60vh;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }
    video#videoElement{width:100%;height:100%;object-fit:cover;display:block;background:#000}
    canvas#overlay{position:absolute;left:0;top:0;pointer-events:none;width:100%;height:100%}
    
    /* Painel de Registros/Gerenciamento */
    .panel{
        background:#fff; 
        padding:10px;
        border-radius:8px;
        margin-top:12px;
        box-shadow:0 1px 6px rgba(0,0,0,.1); 
        color:#111; 
    }
    
    #output{min-height:36px;display:flex;align-items:center;gap:8px;color:#6c757d;padding:4px}
