<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PegazusLog v0.1</title>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: Arial, sans-serif;
      background:#f0f2f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    /* LOGIN */
    .login-container {
      background:white;
      padding:40px;
      border-radius:12px;
      width:340px;
      text-align:center;
      box-shadow:0 4px 20px rgba(0,0,0,0.15);
    }
    .login-container h1 {
      font-size:28px;
      margin-bottom:25px;
      color:#007bff;
    }
    .login-container input {
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }
    .login-container button {
      width:100%;
      padding:12px;
      margin-top:15px;
      border:none;
      border-radius:8px;
      background:#007bff;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.2s;
    }
    .login-container button:hover {
      background:#0056b3;
    }
    #feedbackMessage {
      margin-top:10px;
      font-size:14px;
    }

    /* APP CONTAINER */
    body.logged-in {
      flex-direction:row;
      align-items:flex-start;
      justify-content:flex-start;
      height:auto;
      background:#e9ecef;
    }
    #sidebar {
      display:none;
      background:white;
      padding:15px;
      width:200px;
      min-height:100vh;
      box-shadow:2px 0 5px rgba(0,0,0,0.1);
      position:fixed;
      left:0;
      top:0;
    }
    body.logged-in #sidebar { display:block; }

    #sidebar button {
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border:none;
      border-radius:6px;
      background:#007bff;
      color:white;
      cursor:pointer;
      font-size:14px;
    }
    #sidebar button:hover { background:#0056b3; }

    #appContent {
      margin-left:220px;
      padding:20px;
      width:calc(100% - 220px);
    }

    video#videoElement {
      width:100%;
      max-width:600px;
      border-radius:12px;
      margin-bottom:15px;
      display:none;
    }
    canvas#overlay {
      position:absolute;
      display:none;
    }

    #scansList {
      margin-top:15px;
      max-height:400px;
      overflow:auto;
      background:white;
      border-radius:8px;
      padding:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .item {
      border-bottom:1px solid #eee;
      padding:5px 0;
    }
    .item strong { display:block; }
    .item small { color:#666; font-size:12px; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-container">
    <h1>PegazusLog v0.1</h1>
    <input type="text" id="loginUser" placeholder="Usuário" />
    <input type="password" id="loginPass" placeholder="Senha" />
    <button id="loginBtn">Entrar</button>
    <p id="feedbackMessage"></p>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <button id="btnStartScanner">Abrir Câmera</button>
    <button id="btnMap">Mapa de Entregas</button>
    <button id="btnRoute">Gerar Rota</button>
    <button id="btnSearchQR">Pesquisar QR Code</button>
    <button id="btnFilterDate">Filtrar por Data</button>
    <button id="btnAllCSV">Gerar Relatório CSV</button>
    <button onclick="logout()">Sair</button>
  </div>

  <!-- APP CONTENT -->
  <div id="appContent">
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="scansList">0 entregas registradas.</div>
  </div>

  <script src="jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
