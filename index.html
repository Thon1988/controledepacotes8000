<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pegazus Scanner (Logística)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20n6n9f+e46C383x29x5e7C584a3b7C584a3b7" crossorigin=""></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p60rM96R8+eE2+d5A47C584a3b7" crossorigin=""/>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsqr.min.js"></script>

    <style>
        :root {
            --primary: #3498db;
            --accent: #2ecc71;
            --danger: #e74c3c;
            --background-light: #ecf0f1;
            --sidebar-bg: #2c3e50;
            --content-text-dark: #34495e;
            --modal-bg: #fefefe;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
            color: var(--content-text-dark);
            overflow-x: hidden;
        }

        /* Menu Lateral Fixo Esquerdo (Novo da Imagem) */
        #left-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 60px; /* Largura estreita */
            height: 100vh;
            background-color: var(--sidebar-bg); /* Cor escura do menu */
            padding-top: 50px;
            z-index: 101;
            box-shadow: 3px 0 5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .left-menu-item {
            display: block;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            color: #ecf0f1;
            text-decoration: none;
            font-size: 10px;
            line-height: 1.2;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .left-menu-item:hover, .left-menu-item.active {
            background-color: #34495e;
        }
        
        .left-menu-item.hidden { display: none; }

        /* Container Principal da Aplicação */
        .app {
            display: grid;
            /* 60px (menu fixo) + 392px (sidebar principal) = 452px */
            grid-template-columns: 452px 1fr;
            min-height: 100vh;
            padding-left: 0; /* O deslocamento é feito pelo grid, mas mantemos o padding 0 */
        }
        
        .app.hidden { display: none; }

        /* Sidebar Principal (Menu de Navegação do JS) */
        #sidebar {
            position: fixed;
            top: 0;
            left: 60px; /* Posiciona a sidebar principal após o novo menu fixo */
            width: 392px; /* 452px - 60px */
            height: 100vh;
            background-color: #f8f8f8;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
            box-shadow: 3px 0 5px rgba(0,0,0,0.1);
        }

        #sidebar.hidden {
            /* Se a sidebar principal estiver oculta, o container do app ajusta o grid */
            transform: translateX(-392px);
            left: 60px; /* Mantém a posição original */
        }

        /* Área de Conteúdo Principal */
        #contentArea {
            grid-column: 2 / 3;
            padding: 20px;
            padding-left: 472px; /* Ajusta o padding para compensar a sidebar e o menu fixo */
            width: 100%;
            box-sizing: border-box;
            transition: padding-left 0.3s ease;
        }

        /* Ajuste do conteúdo quando a sidebar está oculta */
        .app[style*="grid-template-columns: 60px 1fr;"] #contentArea {
            padding-left: 80px; /* 60px + 20px de padding */
        }

        /* Login Section */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        
        .login-box input, .login-box button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        .login-box button {
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* Camera View (Scanner) */
        #cameraView {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 200;
        }
        
        #videoElement {
            max-width: 100%;
            max-height: 100%;
            transform: scaleX(-1); /* Inverte a imagem da câmera se necessário */
        }
        
        #scan-focus {
            position: absolute;
            width: 70vw; 
            height: 70vw;
            max-width: 300px;
            max-height: 300px;
            border: 2px solid var(--accent);
            z-index: 201;
            box-sizing: border-box;
            pointer-events: none; 
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4); 
        }

        /* Feedback Flutuante */
        #feedbackMsg {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: var(--primary);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #dashboardFeedback {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #dashboardFeedback.show { opacity: 1; }

        /* Modal de Configuração de Câmera/Filtros (Referência da Imagem) */
        .modal {
            display: none; /* Escondido por padrão */
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4); /* Fundo semi-transparente */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--modal-bg);
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border-top: 5px solid var(--primary);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary);
            color: white;
            margin: -20px -20px 15px -20px;
            padding: 15px 20px;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .modal-header h2 { margin: 0; font-size: 1.2em;}

        .close-btn {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        
        .modal-field-group { margin-bottom: 15px; }
        
        .modal-field-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
            font-size: 0.9em;
        }

        .modal-field-group select, .modal-field-group input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .modal-button-group button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        /* Cores baseadas na imagem para os botões da modal */
        #abrirCameraParaComprovante { background-color: var(--primary); }
        #AptsaischanComprovante { background-color: #4CAF50; } /* Verde - Ações de sucesso */
        #AfssranRota { background-color: #2196F3; } /* Azul claro */
        #MesranRota { background-color: #673AB7; } /* Roxo */
        #CararIagas { background-color: #FF9800; } /* Laranja */

        /* Mobile Adjustments */
        #mobileMenuBtn {
            position: fixed;
            top: 10px;
            left: 70px; /* Afastado do novo menu fixo */
            z-index: 102;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .app {
                grid-template-columns: 1fr;
            }
            
            #left-menu {
                width: 50px; /* Um pouco menor no mobile */
            }

            #sidebar {
                transform: translateX(-100%);
                left: 50px; /* Posiciona no novo menu fixo */
                width: calc(100% - 50px);
                box-shadow: 5px 0 10px rgba(0,0,0,0.3);
            }
            
            #sidebar.active {
                transform: translateX(0);
            }

            #contentArea {
                padding: 20px;
                grid-column: 1 / 2; 
            }
            
            #mobileMenuBtn {
                display: block;
            }
            
            .left-menu-item { font-size: 9px; padding: 10px 0; }
        }
    </style>
</head>
<body>
    
    <nav id="left-menu">
        <a href="#" class="left-menu-item" title="Ounbod">
            <span style="font-size: 18px;">🏠</span>
            Ounbod
        </a>
        <a href="#" class="left-menu-item" title="Fip Ailes">
            <span style="font-size: 18px;">📋</span>

        </a>
        <a href="#" class="left-menu-item active" id="btnComar">
            <span style="font-size: 18px;">📸</span>
            Comãr
        </a>
        <a href="#" class="left-menu-item" title="Flip">
            <span style="font-size: 18px;">🔄</span>
            Flip
        </a>
        <a href="#" class="left-menu-item" title="Mosmmaes">
            <span style="font-size: 18px;">📝</span>
            Mosmmaes
        </a>
        <a href="#" class="left-menu-item" title="Steormias">
            <span style="font-size: 18px;">⚙️</span>
            Steormias
        </a>
        <a href="#" class="left-menu-item" title="Oolcolleticts">
            <span style="font-size: 18px;">📦</span>
            Oolcolleticts
        </a>
        <a href="#" class="left-menu-item" title="Nor So">
            <span style="font-size: 18px;">📍</span>
            Nor So
        </a>
        <a href="#" class="left-menu-item" title="Norlaga">
            <span style="font-size: 18px;">🗺️</span>
            Norlaga
        </a>
        <a href="#" class="left-menu-item" title="Mateapas">
            <span style="font-size: 18px;">🔗</span>
            Mateapas
        </a>
        <a href="#" class="left-menu-item" title="Noorrâs">
            <span style="font-size: 18px;">🔔</span>
            Noorrâs
        </a>
    </nav>

    <button id="mobileMenuBtn" class="hidden">☰</button>

    <section id="loginSection">
        <div class="login-box">
            <h2>Pegazus Login</h2>
            <input type="text" id="loginUser" placeholder="Usuário (ex: thon)" required>
            <input type="password" id="loginPass" placeholder="Senha (ex: 882010)" required>
            <button id="btnLogin">Entrar</button>
            <p id="loginError" style="color: var(--danger); font-size: 0.9em;"></p>
        </div>
    </section>

    <div class="app hidden" id="appContainer">
        
        <aside id="sidebar">
             <div class="sidebar-header">
                <h3>Captura de Foto/ QR Code</h3>
                <span id="displayUser" style="font-size: 0.8em;"></span>
            </div>

            <nav id="menuSection">
                <button class="menu-item active" id="btnDashboard">Dashboard</button>
                <button class="menu-item" id="btnScanner">Scanner QR/Câmera</button>
                <button class="menu-item" id="btnMap">Mapa de Entregas</button>
                <button class="menu-item" id="btnRoutes">Rotas Otimizadas</button>
            </nav>

            <div id="adminMenuOptions" class="hidden" style="margin-top: 20px;">
                <hr>
                <h4>Admin/Gestor</h4>
                <button class="menu-item" id="btnUsers">Gerenciar Usuários</button>
                <div class="export-container" style="position: relative;">
                    <button class="menu-item" id="btnExport">Exportar Dados (CSV)</button>
                    <div id="exportOptions" style="display: none; flex-direction: column; padding: 10px; border: 1px solid #ddd; border-top: none; position: absolute; background: white; z-index: 99; width: calc(100% - 20px);">
                        <button id="btnExportDaily" style="padding: 5px; margin-bottom: 5px;">Dia</button>
                        <button id="btnExportWeekly" style="padding: 5px; margin-bottom: 5px;">Semana</button>
                        <button id="btnExportMonthly" style="padding: 5px; margin-bottom: 5px;">Mês</button>
                        <button id="btnExportAll" style="padding: 5px;">Tudo</button>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <button id="btnLogout" style="background-color: var(--danger); color: white; padding: 10px; width: 100%; border: none; border-radius: 4px; cursor: pointer;">Sair</button>
            </div>
            
            <div id="manualInputContainer" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; background: #fff; opacity: 0; transition: opacity 0.3s; pointer-events: none;">
                <h5>Entrada Manual</h5>
                <input type="text" id="manualDeliveryId" placeholder="ID da Entrega" style="width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px;">
                <button id="btnManualConfirm" style="width: 100%; padding: 8px; background-color: var(--accent); color: white; border: none; border-radius: 4px;">Confirmar ID</button>
            </div>
            <button id="btnToggleManualInput" style="margin-top: 10px; padding: 5px 10px; background-color: #f39c12; color: white; border: none; border-radius: 4px; width: 100%;">ID Manual</button>

        </aside>

        <main id="contentArea">
            <div style="text-align:center;margin-top:20vh;opacity:0.5; color:var(--content-text-dark)">
                <h2>Bem-vindo ao Pegazus!</h2>
                <p>Navegue pelo menu lateral.</p>
            </div>
        </main>
        
        <div id="dashboardFeedback" class="hidden">Mensagem de Sucesso!</div>
    </div>
    
    <section id="cameraView">
        <video id="videoElement" style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div id="scan-focus"></div>
        <select id="cameraSelect" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 202;"></select>
    </section>

    <div id="feedbackMsg"></div>

    <div id="cameraModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Câmera Modal</h2>
                <span class="close-btn">&times;</span>
            </div>

            <div class="modal-body">
                <div class="modal-field-group">
                    <label for="modal-status">Filtros: Status</label>
                    <select id="modal-status">
                        <option>Todos</option>
                        <option>Pendentes</option>
                        <option>Entregues</option>
                    </select>
                </div>

                <div class="modal-field-group">
                    <label for="modal-fatus">Fatus:</label>
                    <select id="modal-fatus">
                        <option>Em Rota</option>
                        <option>No CD</option>
                        <option>Em Separação</option>
                    </select>
                </div>

                <div class="modal-field-group">
                    <label for="modal-potra">Potra:</label>
                    <select id="modal-potra">
                        <option>Entregue</option>
                        <option>Não Entregue</option>
                    </select>
                </div>

                <div class="modal-field-group">
                    <label for="modal-data">Data:</label>
                    <input type="text" id="modal-data" placeholder="Data">
                </div>

                <div class="modal-button-group">
                    <button id="abrirCameraParaComprovante">abrir Camera Para Comprovante (id)</button>
                    <button id="AptsaischanComprovante">Aptsaischan Comprovante (id)</button>
                    <button id="AfssranRota">Afssran Rota (F28e77 / 32.5)</button>
                    <button id="MesranRota">Mesran Rota (007bi ff (Bf 5)</button>
                    <button id="CararIagas">Carar Iagas (sians)</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    
    <script>
        // Funções de toggle da sidebar para o botão mobile (permanecem aqui para fácil acesso)
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const app = document.getElementById('appContainer');
            
            if (window.innerWidth <= 768) {
                // Apenas alterna a classe 'active' no mobile
                sidebar.classList.toggle('active');
            } else {
                 // Alterna a classe 'hidden' no desktop
                 const isHidden = sidebar.classList.toggle('hidden');
                 
                 // Ajusta o grid para 60px (menu lateral) OU 452px (menu lateral + sidebar)
                 app.style.gridTemplateColumns = isHidden ? '60px 1fr' : '452px 1fr';
                 // Ajusta o padding da contentArea
                 document.getElementById('contentArea').style.paddingLeft = isHidden ? '80px' : '472px';
            }
        }
        
        // Listener para o botão mobile
        document.getElementById('mobileMenuBtn').addEventListener('click', window.toggleSidebar);
    </script>
</body>
</html>
