<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>📦 Scanner de Pacotes</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --accent:#007bff;
      --muted:#666;
    }

    /* Base Styling */
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:#111}
    .app{ max-width:920px; margin:18px auto; padding:18px; }
    h1{ margin:0 0 12px; font-size:20px; text-align: center; }
    
    /* Login Specific Styling */
    #login-container { max-width: 350px; margin: 80px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: var(--card); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    #login-container h2 { margin-top: 0; font-size: 18px; text-align: center; }
    #loginForm input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    #loginForm button { width: 100%; }
    #feedbackMessage { text-align: center; margin-top: 10px; font-weight: bold; }

    /* Controls and Scanner Styling (Mantido) */
    .controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
    button{background:var(--accent);color:#fff;border:0;padding:10px 14px;border-radius:6px;cursor:pointer}
    button.secondary{background:#6c757d}
    button.warn{background:#d9534f}
    button:disabled{opacity:.6;cursor:default}
    .camera-wrap{position:relative;max-width:720px;margin:0 auto;border-radius:10px;overflow:hidden;background:#000; display:flex; justify-content:center; align-items:center; height: 350px;}
    video#videoElement{width:100%;height:100%;object-fit:cover;display:block}
    canvas#overlay{position:absolute;left:0;top:0;pointer-events:none;width:100%;height:100%}
    .panel{background:var(--card);padding:12px;border-radius:8px;margin-top:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    #output{min-height:44px;display:flex;align-items:center;gap:8px;color:var(--muted); font-weight: bold;}
    .list{max-height:240px;overflow:auto;margin-top:8px;border-radius:6px;border:1px solid #eee;padding:8px}
    .item{padding:8px;border-radius:6px;border-bottom:1px solid #f0f0f0;display:flex;flex-direction:column;gap:6px}
    .item:last-child{border-bottom:0}
    .meta{font-size:12px;color:var(--muted)}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px}
    .actions{margin-left:auto;display:flex;gap:8px}
    .row{display:flex;align-items:center;gap:8px}
    .auto-open-control { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding: 4px; margin-left: auto; }
    #scanPopup{position:fixed;right:16px;bottom:16px;background:#222;color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:9999}
    @media (max-width:520px){ .controls{flex-direction:column;align-items:stretch} }
  </style>
</head>
<body>
  <div class="app">
    <h1>📦 Scanner de Pacotes</h1>

    <div id="login-container">
        <h2>Acesso Restrito</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <div id="feedbackMessage"></div>
        </form>
    </div>

    <div id="scanner-container" style="display: none;">
        <div class="controls">
            <button id="startButton">▶️ Abrir Câmera / Iniciar</button>
            <button id="stopButton" class="secondary" style="display:none">⏹️ Parar</button>
            <button id="torchButton" class="secondary" style="display:none">🔦 Flash Off</button>
            <button id="exportBtn" class="secondary">⬇️ Exportar CSV</button>
            <button id="clearBtn" class="warn">🧹 Limpar registros</button>
            
            <div class="auto-open-control">
                <input type="checkbox" id="autoOpenToggle">
                <label for="autoOpenToggle" id="autoOpenStatus">Auto-abrir: Desativado</label>
            </div>
        </div>

        <div class="camera-wrap" id="cameraWrap">
            <video id="videoElement" muted autoplay playsinline></video>
            <canvas id="overlay"></canvas>
        </div>

        <div class="panel">
            <div id="output">Aguardando início do scanner.</div>
            <div class="list" id="scansList" aria-live="polite"></div>
        </div>
    </div>
  </div>

  <div id="scanPopup" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
