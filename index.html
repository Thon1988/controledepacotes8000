<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PegazusLog App</title>
    <link rel="stylesheet" href="style.css">
    <!-- HTML5 QR Code library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="sidebar">
        <h2>PegazusLog</h2>
        <button onclick="showDashboard()">Dashboard</button>
        <button onclick="showUsers()">Usuários</button>
        <button onclick="showScanner()">Scanner</button>
        <div class="footer-btn">
            <button onclick="goBack()">Voltar</button>
        </div>
    </div>

    <div class="main-content">
        <!-- Login -->
        <div id="login-section" class="login-card">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Usuário">
            <input type="password" id="password" placeholder="Senha">
            <button onclick="login()">Entrar</button>
            <p class="app-name">PegazusLog</p>
            <p id="login-error" class="error"></p>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-section" class="card hidden">
            <h2>Dashboard</h2>
            <p>Bem-vindo ao painel!</p>
        </div>

        <!-- Usuários -->
        <div id="users-section" class="card hidden">
            <h2>Gerenciar Usuários</h2>
            <input type="text" id="new-username" placeholder="Novo usuário">
            <input type="password" id="new-password" placeholder="Senha">
            <button onclick="addUser()">Adicionar Usuário</button>
            <ul id="user-list"></ul>
        </div>

        <!-- Scanner -->
        <div id="scanner-section" class="card hidden">
            <h2>Scanner de QR Code</h2>
            <div id="qr-reader"></div>
            <p id="scan-result"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
