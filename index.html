<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PegazusLog — Scanner (Opção A)</title>

  <!-- jsQR (QR reader) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>

  <!-- Leaflet (mapa) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <style>
    :root{
      --bg:#0f1724;
      --panel:#0b1220;
      --accent:#00b4d8;
      --success:#00c853;
      --muted:#9aa4b2;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#071022 0%,#071827 100%);color:#e6eef6}
    .app {
      display:grid; grid-template-columns: 300px 1fr; gap:16px; padding:18px; height:100vh;
      box-sizing:border-box;
    }
    /* sidebar */
    .sidebar {
      background:rgba(10,14,20,0.6); border-radius:12px; padding:14px; overflow:auto;
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      display:none; /* só aparece após login */
    }
    .logo { font-weight:700; font-size:18px; color:var(--accent); margin-bottom:10px }
    .user-info{ font-size:13px; color:var(--muted); margin-bottom:12px}
    .nav { display:flex; flex-direction:column; gap:8px; margin-bottom:10px }
    .nav button { background:transparent; border:1px solid rgba(255,255,255,0.04); color:#dbeafe; padding:8px 10px; border-radius:8px; text-align:left; cursor:pointer; }
    .nav button.primary { background:var(--accent); color:#042028; border:none; font-weight:600; }
    .small { font-size:13px; color:var(--muted) }

    /* main area */
    .main {
      display:flex; flex-direction:column; gap:12px; height:100%;
    }
    .card { background: rgba(7,12,20,0.5); border-radius:12px; padding:12px; box-shadow: 0 6px 14px rgba(0,0,0,0.3); }
    #contentArea { overflow:auto; flex:1; }

    /* login */
    #loginPage {
      max-width:380px; margin:auto; padding:26px;
      background:var(--panel); border-radius:12px;
      text-align:center; box-shadow:0 6px 14px rgba(0,0,0,0.4)
    }
    #loginPage input {
      width:100%; padding:12px; margin-top:10px;
      border-radius:8px; border:1px solid #223;
      background:#0f1724; color:#fff;
    }
    #loginPage button {
      width:100%; padding:12px; margin-top:16px;
      background:var(--accent); border:0; border-radius:8px;
      color:#012; cursor:pointer; font-weight:600;
    }

    /* camera area */
    .camera-wrap {
      position:relative; width:100%; height:60vh;
      border-radius:10px; overflow:hidden; background:#000;
      display:none; align-items:center; justify-content:center;
    }
    video#videoElement { width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1); }
    canvas#overlay { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; }

    /* scanning line */
    .scan-line {
      position:absolute; left:0; right:0; height:2px;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);
      animation:sweep 2s linear infinite;
    }
    @keyframes sweep {
      0% { top:22%; }
      50% { top:78%; }
      100% { top:22%; }
    }

    #qrFeedback {
      position:fixed; left:50%; top:15px; transform:translateX(-50%);
      padding:10px 14px; background:rgba(0,0,0,0.8);
      border-radius:10px; color:#fff; font-weight:700;
      display:none; z-index:10000;
    }

  </style>
</head>
<body>

<div id="qrFeedback"></div>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <h2>PegazusLog</h2>
  <input id="loginUser" placeholder="Usuário" value="thon">
  <input id="loginPass" placeholder="Senha" type="password">
  <button id="loginBtn">Entrar</button>
  <div id="loginError" style="color:#ff6b6b;margin-top:8px"></div>
</div>

<!-- APP REAL -->
<div class="app" id="appContainer" style="display:none">

  <!-- SIDEBAR -->
  <div class="sidebar card" id="sidebar">
    <div class="logo">PegazusLog</div>
    <div class="user-info" id="userInfo">Usuário: —</div>

    <div class="nav">
      <button id="btnCamera" class="primary">📷 Abrir Scanner</button>
      <button id="btnEntregas">📦 Entregas</button>
      <button id="btnMapa">📍 Mapa</button>
      <button id="btnUsers">👥 Usuários</button>
      <button id="btnGenerateCSV">📄 Gerar CSV</button>
      <button id="btnGerarRota">🗺️ Gerar Rota</button>
      <button id="btnSync">🔄 Sincronizar</button>
    </div>

    <div class="small">Dispositivos de Câmera</div>
    <select id="deviceSelect" style="width:100%;padding:8px;border-radius:8px;margin-top:6px"></select>

    <div style="display:flex;gap:6px;margin-top:8px">
      <button id="torchButton">Flash</button>
      <button id="stopButton" style="display:none">Parar</button>
    </div>

    <hr style="border:none;height:1px;background:#123;margin:12px 0">

    <div class="small">Leituras</div>
    <div id="scansList"></div>

    <div style="display:flex;gap:8px;margin-top:14px">
      <button id="exportBtn">Exportar</button>
      <button id="clearBtn">Limpar</button>
    </div>

  </div>

  <!-- MAIN CONTENT -->
  <div class="main">
    <div class="card camera-wrap" id="cameraContainer">
      <video id="videoElement" playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="scan-line"></div>
    </div>

    <div id="contentArea" class="card">
      <h2>Bem-vindo ao PegazusLog</h2>
      <p>Clique em <strong>Abrir Scanner</strong> para iniciar.</p>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
