<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PegazusLog • Scanner</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6c757d;
      --accent: #007bff;
      --accent-hover: #0069d9;
      --border: #e5e7eb;
      --shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    body { margin:0; background:var(--bg); font-family:Inter; color:var(--text); }

    /* SIDEBAR */
    #sidebar {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: var(--card);
      box-shadow: var(--shadow);
      padding: 20px;
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 9999;
    }

    #sidebar.open { left: 0; }

    #menuBtn {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      cursor: pointer;
      z-index: 9999;
      display:none;
    }

    body.logged-in #menuBtn { display:block; }

    .side-btn {
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--accent);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      text-align:center;
    }

    /* LOGIN */
    #loginScreen { display:flex; justify-content:center; align-items:center; min-height:100vh; }
    #loginBox { background:var(--card); padding:30px; border-radius:12px; width:320px; box-shadow:var(--shadow); }

    /* APP */
    .app { display:none; padding:20px; max-width:900px; margin:auto; }
    body.logged-in .app { display:block; }
    body.logged-in #loginScreen { display:none; }

    .controls { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

    .camera-wrap { background:#000; height:55vh; border-radius:14px; overflow:hidden; position:relative; }

    #scansList { margin-top:10px; padding:10px; background:#fff; border-radius:10px; box-shadow:var(--shadow); }
    .item { padding:10px 4px; border-bottom:1px solid var(--border); }
    .item:last-child { border-bottom:0; }
  </style>
</head>
<body>

<button id="menuBtn">☰ Menu</button>

<div id="sidebar">
  <div class="side-btn" onclick="openMapa()">📍 Mapa de Entregas</div>
  <div class="side-btn" onclick="gerarRota()">🧭 Gerar Rota</div>
  <div class="side-btn" onclick="listarEntregas()">📦 Entregas</div>
  <div class="side-btn" onclick="pesquisarQRCode()">🔍 Pesquisar QRCode</div>
  <div class="side-btn" id="exportBtn">📄 Gerar Relatório</div>
  <div class="side-btn" onclick="logout()">🚪 Sair</div>
</div>

<div id="loginScreen">
  <div id="loginBox">
    <h2>🔑 Login</h2>
    <input id="loginUser" placeholder="Usuário">
    <input id="loginPass" type="password" placeholder="Senha">
    <button id="loginBtn">Entrar</button>
    <p id="feedbackMessage">Digite suas credenciais</p>
  </div>
</div>

<div class="app">
  <h1>PegazusLog • Scanner</h1>

  <div class="controls">
    <button id="cameraBtn">📷 Abrir Câmera</button>
    <button id="stopButton" style="display:none">⏹️ Parar</button>
  </div>

  <div class="camera-wrap">
    <video id="videoElement" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="panel">
    <div id="output">Aguardando...</div>
    <div id="scansList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="app.js"></script>

</body>
</html>
