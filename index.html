<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦 Scanner de Pacotes</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        /* CSS OMITIDO POR BREVIDADE */
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f0f0f0; }
        #videoElement { width: 100%; max-width: 450px; height: auto; border: 4px solid #333; border-radius: 8px; display: block; margin: 15px auto; }
        #output { margin: 20px auto; padding: 15px; border: 1px dashed gray; border-radius: 6px; background-color: white; max-width: 400px; min-height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>📦 Scanner de Pacotes</h1>
    
    <button id="startButton" onclick="startCamera()">▶️ Abrir Câmera / Iniciar Scanner</button>
    
    <video id="videoElement" muted></video>
    
    <div id="output">
        <p>Aguardando início do scanner.</p>
    </div>
    
    <button onclick="exportCSV()">Exportar Dados para CSV</button>

    <script src="app.js"></script>
</body>
</html>
