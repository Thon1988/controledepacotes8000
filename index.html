<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PegazusLog — Scanner Integrado</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <script src="app.js" defer></script> 

  <style>
    /* --- VARIÁVEIS DE COR PADRÃO (TEMA CLARO - DEFAULT) --- */
    :root {
      /* Base - Sidebar Dark / Conteúdo Light */
      --bg: #0f172a; 
      --panel: rgba(30, 41, 59, 0.95); 
      --text: #f1f5f9; 
      --muted: #94a3b8; 
      
      /* Conteúdo Light */
      --content-bg-light: #f4f6f8; 
      --content-card-bg: #ffffff; 
      --content-text-dark: #1f2937; 

      /* Acento */
      --accent: #38bdf8; 
      --accent-dark: #0ea5e9; 
      --success: #22c55e; 
      --danger: #ef4444; 
      
      --radius: 25px; 
      
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* --- MEDIA QUERY: TEMA DARK COMPLETO (Se preferência do usuário for dark) --- */
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #020617; 
            --panel: rgba(15, 23, 42, 0.95); 
            
            --content-bg-light: #0f172a; 
            --content-card-bg: rgba(30, 41, 59, 0.7); 
            --content-text-dark: #f1f5f9; 
            
            --text: #f1f5f9; 
            --muted: #94a3b8; 
        }

        /* Ajustes específicos para elementos no modo Dark */
        .user-form-card, #contentArea > div > div {
            border: 1px solid rgba(255,255,255,0.05) !important;
            box-shadow: none !important;
        }

        /* Inputs na área de conteúdo (que agora é dark) */
        .main input, .main select {
             background: rgba(0,0,0,0.3) !important;
             border: 1px solid rgba(255,255,255,0.1) !important;
             color: white !important;
        }
        
        /* Botões de edição e delete no modo Dark */
        .user-form-card button:first-of-type { 
            background: rgba(56, 189, 248, 0.2) !important; 
            color: var(--accent) !important; 
        }
        .user-form-card button:nth-of-type(2) { 
            background: rgba(239, 68, 68, 0.2) !important; 
            color: var(--danger) !important; 
        }
    }


    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background: linear-gradient(180deg, var(--bg) 0%, #000 100%);
      color: var(--content-text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px; 
    }

    /* --- LAYOUT GERAL DO APP --- */
    .app {
      display: grid;
      grid-template-columns: 392px 1fr; 
      background: var(--content-bg-light);
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
    }

    /* --- SIDEBAR (BARRA LATERAL) --- */
    .sidebar {
      background: var(--panel);
      color: var(--text);
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 10px rgba(0,0,0,0.2);
      position: relative;
      z-index: 10;
    }
    
    .logo {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 30px;
        display: flex;
        align-items: center;
    }

    .menu-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s, color 0.2s;
      font-weight: 500;
    }

    .menu-item:hover {
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
    }
    
    .menu-item.active {
        background: var(--accent);
        color: var(--panel);
        font-weight: 700;
    }

    /* --- FOOTER DA SIDEBAR --- */
    .sidebar-footer {
        margin-top: auto;
        padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
    .user-info {
        font-size: 14px;
        color: var(--muted);
    }
    .user-info strong {
        color: var(--text);
        font-weight: 600;
    }

    /* --- MAIN CONTENT (ÁREA DE CONTEÚDO) --- */
    .main {
      padding: 30px;
      overflow-y: auto;
      height: 100%;
    }
    
    .main h2 {
        color: var(--content-text-dark);
        margin-top: 0;
    }
    
    .main input, .main select {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
        font-size: 16px;
        color: var(--content-text-dark);
        background: #fff;
    }
    
    .user-form-card {
        background: var(--content-card-bg);
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        margin-bottom: 10px;
    }

    /* --- LOGIN SCREEN --- */
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background: var(--bg);
    }
    .login-card {
        background: var(--panel);
        padding: 40px;
        border-radius: var(--radius);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        text-align: center;
        max-width: 400px;
        width: 90%;
        color: var(--text);
    }
    .login-card h1 {
        color: var(--accent);
        margin-bottom: 30px;
        font-size: 28px;
    }
    .login-card input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: none;
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        font-size: 16px;
    }
    .login-card input::placeholder {
        color: var(--muted);
    }
    #loginError {
        color: var(--danger);
        margin-top: 10px;
        font-size: 14px;
    }

    /* --- BOTÕES E GERAL --- */
    .btn-primary {
        background: var(--accent);
        color: var(--content-text-dark);
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        transition: background-color 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 10px rgba(56, 189, 248, 0.4);
    }
    .btn-primary:hover {
        background: var(--accent-dark);
    }
    
    .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        transition: background-color 0.2s;
    }
    .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.2);
    }

    /* --- CAMERA VIEW --- */
    #cameraView {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        display: none; 
        justify-content: center;
        align-items: center;
        z-index: 1000;
    }
    #videoElement {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .scan-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90vmin; 
        height: 90vmin;
        max-width: 400px;
        max-height: 400px;
        border: 4px solid rgba(255,255,255,0.5);
        border-radius: 15px;
        z-index: 1001;
        transition: border-color 0.3s;
    }
    
    #feedbackMsg {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
        color: var(--content-text-dark);
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: bold;
        z-index: 1002;
        opacity: 0;
        transition: opacity 0.3s;
        max-width: 90%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .camera-controls {
        position: absolute;
        top: 10px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 10px;
        z-index: 1002;
    }
    
    .camera-controls .right-controls {
        display: flex;
        gap: 10px;
    }

    .camera-controls button {
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        padding: 10px;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        cursor: pointer;
    }
    
    #cameraSelect {
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 8px;
        margin-right: 10px;
        appearance: none;
        cursor: pointer;
    }

    /* --- MODAL DE ENTRADA MANUAL --- */
    .modal-backdrop{ 
        position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; 
        z-index:2000; justify-content:center; align-items:center; 
    }
    .modal{ 
        background:white; padding:20px; border-radius:12px; width:90%; 
        max-width:420px; color:var(--content-text-dark);
    }
    .modal h3{ margin:0 0 12px 0; }
    .modal input{ 
        width:100%; padding:10px; margin-bottom:15px; border-radius:8px; 
        border:1px solid #ddd; font-size:16px;
    }
    .modal-dark { 
        background: var(--content-card-bg);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--content-text-dark);
    }

    /* --- EXPORT OPTIONS --- */
    #exportOptions {
        position: absolute;
        right: 0;
        top: 100%;
        background: var(--content-card-bg);
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        padding: 12px;
        display: none; 
        flex-direction: column;
        gap: 8px;
        z-index: 60;
        min-width: 250px;
        border: 1px solid #eee; 
    }

    #exportOptions label {
        font-size: 13px;
        color: var(--muted);
        margin-top: 5px;
        margin-bottom: -3px;
    }

    #exportOptions input, #exportOptions select {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-bottom: 6px;
        font-size: 14px;
        color: var(--content-text-dark);
        background: var(--content-bg-light); 
    }
    
    .export-container {
        position: relative;
    }
    .export-container .menu-item:hover {
        background: transparent !important;
        color: var(--text) !important;
    }


    /* --- UTILIDADES --- */
    .hidden { display: none !important; }

    /* --- MEDIA QUERIES (RESPONSIVIDADE) --- */
    @media (max-width: 900px) { 
        .app {
            grid-template-columns: 1fr;
            height: 100vh;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100%;
            transform: translateX(-300px);
            transition: transform 0.3s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            padding: 30px 20px;
            overflow-y: auto;
        }
        
        .sidebar.active {
            transform: translateX(0);
        }

        .main {
            padding: 20px;
            height: 100%;
        }

        /* Botão de menu mobile */
        #mobileMenuBtn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 100;
            background: var(--accent);
            color: var(--content-text-dark);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            line-height: 1;
        }
    }
  </style>
</head>
<body>

  <button id="mobileMenuBtn" style="display:none;" onclick="window.toggleSidebar()">☰</button>

  <section id="loginSection" class="login-container">
    <div class="login-card">
      <h1>PegazusLog</h1>
      <input type="text" id="loginUser" placeholder="Usuário" value="thon" />
      <input type="password" id="loginPass" placeholder="Senha" value="882010" />
      <button id="btnLogin" class="btn-primary" style="width: 100%">Entrar</button>
      <p id="loginError"></p>
    </div>
  </section>

  <div class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="logo">
          📦 PegazusLog
      </div>

      <div id="menuSection">
        <div id="btnDashboard" class="menu-item active">🏠 Dashboard</div>
        <div id="btnScanMode" class="menu-item">📷 Iniciar Scanner</div>
        <div id="btnDeliveries" class="menu-item">📃 Lista de Entregas</div>
        <div id="btnMap" class="menu-item">🗺️ Mapa de Entregas</div>
        <div id="btnRoutes" class="menu-item">🧭 Otimizar Rotas</div>
        
        <div id="adminMenuOptions" class="hidden">
            <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">
            <div id="btnUsers" class="menu-item">👥 Usuários</div>

            <div class="export-container menu-item" style="position:relative;">
                <button id="btnExport" style="background:none; border:none; color:inherit; font:inherit; padding:0; display:flex; align-items:center; gap:10px; cursor:pointer;">
                    ⬇️ Exportar Dados
                </button>
                
                <div id="exportOptions" aria-hidden="true">
                    <label>Buscar por usuário (login)</label>
                    <input id="exportUserFilter" placeholder="Digite o login (opcional)"/>
                    <label>Período</label>
                    <select id="exportPeriod">
                        <option value="daily">Últimas 24h</option>
                        <option value="weekly">Últimos 7 dias</option>
                        <option value="monthly">Últimos 30 dias</option>
                        <option value="all">Todos os Dados</option>
                    </select>
                    <button id="btnGenerateCSV" class="btn-primary" style="width:100%; margin-top:5px;">Gerar CSV</button>
                </div>
            </div>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">Logado como: <strong id="displayUser"></strong></div>
        <button id="btnLogout" class="btn-secondary" style="margin-top:10px; width: 100%">Sair</button>
      </div>
    </aside>

    <main class="main">
      <div id="contentArea">
        </div>
    </main>
  </div>

  <section id="cameraView">
    <video id="videoElement" playsinline></video>
    <div class="scan-overlay"></div>
    <div class="camera-controls">
        <button id="btnCloseCamera" onclick="window.renderDashboard()">✕</button>
        <div class="right-controls">
            <select id="cameraSelect" class="hidden"></select>
            <button id="btnTorch">💡</button>
            <button id="btnManual">✏️</button>
        </div>
    </div>
    <div id="feedbackMsg"></div>
  </section>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Inserir rastreio manual</h3>
      <input id="manualInput" placeholder="Cole ou digite o código do QR / rastreio" />
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button id="manualCancel" class="btn-secondary">Cancelar</button>
        <button id="manualSave" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>

</body>
</html>
