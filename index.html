<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PegazusLog — Scanner + Mapas (Clustering / Heat / Rotas)</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <style>
    :root{ --sidebar-w:280px; --accent:#38bdf8; --danger:#ef4444; --bg:#f4f6f8; --card:#fff; font-family:Inter, system-ui, -apple-system, sans-serif; }
    *{box-sizing:border-box}
    body{ margin:0; background:var(--bg); color:#1f2937; }
    .app{ display:flex; min-height:100vh; width:100vw; overflow:hidden; }
    .sidebar{ width:var(--sidebar-w); min-width:var(--sidebar-w); background:#0f172a; color:#fff; padding:18px; display:flex; flex-direction:column; gap:12px; z-index:100; box-shadow:2px 0 8px rgba(0,0,0,.12); }
    .logo{ font-weight:800; color:var(--accent); font-size:18px; }
    .menu-item{ padding:10px 12px; border-radius:8px; cursor:pointer; display:flex; gap:10px; align-items:center; }
    .menu-item:hover, .menu-item.active{ background:rgba(255,255,255,0.04); color:var(--accent); }
    .content{ flex:1; padding:20px; overflow:auto; background:linear-gradient(180deg,#f8fafc,#eef2f7); position:relative; }
    .cards{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
    .card{ background:var(--card); border-radius:12px; padding:14px; min-width:220px; max-width:420px; box-shadow:0 6px 20px rgba(16,24,40,0.06); cursor:pointer; transition:transform .14s; }
    .card:hover{ transform:translateY(-6px) }
    .big{ font-size:28px; font-weight:800; }
    .muted{ color:#6b7280; font-size:13px; }
    .expandable{ max-height:0; overflow:hidden; transition:max-height .35s ease; margin-top:10px; }
    .expandable.open{ max-height:420px; }
    .list{ display:flex; flex-direction:column; gap:8px; }
    .list-item{ background:#fbfdff; padding:10px; border-radius:8px; display:flex; justify-content:space-between; gap:12px; border-left:4px solid var(--accent); }
    .btn{ padding:8px 10px; border-radius:8px; border:none; cursor:pointer; }
    .btn.primary{ background:var(--accent); color:#072; font-weight:700; }
    .btn.secondary{ background:#eef2f7; color:#15335b; }
    /* Map overlay that leaves sidebar visible */
    #mapOverlay{ position:fixed; top:0; left:var(--sidebar-w); width:calc(100% - var(--sidebar-w)); height:100vh; z-index:80; display:none; background:#fff; box-shadow: -6px 0 20px rgba(0,0,0,0.08); transform:translateY(12px); opacity:0; transition:transform .28s cubic-bezier(.2,.9,.2,1), opacity .18s; }
    #mapOverlay.open{ display:block; transform:translateY(0); opacity:1; }
    #mapContainer{ width:100%; height:100%; }
    #mapCloseBtn{ position:absolute; top:14px; right:14px; z-index:120; background:var(--danger); color:white; border:none; padding:10px 12px; border-radius:8px; cursor:pointer; box-shadow:0 10px 20px rgba(0,0,0,0.12); font-weight:700; }
    /* Scanner full-screen */
    #cameraView{ position:fixed; inset:0; background:#000; display:none; z-index:200; align-items:center; justify-content:center; }
    #videoElement{ width:100%; height:100%; object-fit:cover; }
    .scan-overlay{ position:absolute; width:78vmin; height:78vmin; max-width:600px; max-height:600px; border:4px dashed rgba(255,255,255,0.45); border-radius:12px; pointer-events:none; }
    .scanner-controls{ position:absolute; top:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:210; }
    .scanner-controls select, .scanner-controls button{ padding:8px 10px; border-radius:8px; border:none; }
    #feedbackMsg{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent); color:#071430; padding:8px 14px; border-radius:10px; z-index:210; opacity:0; transition:opacity .2s; }
    #manualInputContainer{ position:absolute; bottom:90px; left:50%; transform:translateX(-50%); z-index:210; display:flex; gap:8px; }
    input[type="text"], input[type="password"], select{ padding:10px; border-radius:8px; border:1px solid #e6eefb; }
    @media (max-width:900px){ :root{ --sidebar-w:80px } .sidebar{ width:var(--sidebar-w); min-width:var(--sidebar-w); } .menu-item span:nth-child(2){ display:none } #mapOverlay{ left:var(--sidebar-w); width:calc(100% - var(--sidebar-w)); } }
  </style>
</head>
<body>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo">📦 PegazusLog</div>

      <div>
        <div id="btnDashboard" class="menu-item active"><span>🏠</span><span>Dashboard</span></div>
        <div id="btnScanMode" class="menu-item"><span>📷</span><span>Scanner</span></div>
        <div id="btnMap" class="menu-item"><span>🗺️</span><span>Mapa</span></div>
        <div id="btnRoutes" class="menu-item"><span>🧭</span><span>Rotas</span></div>
      </div>

      <div style="margin-top:auto">
        <div class="muted">Logado como</div>
        <div id="displayUser" style="font-weight:700">—</div>
      </div>
    </aside>

    <section class="content" id="content">
      <div id="dashboardRoot">
        <div style="text-align:center;margin-top:18vh;opacity:0.6">
          <h2>Bem-vindo — selecione uma opção</h2>
        </div>
      </div>
    </section>
  </div>

  <!-- Map overlay (keeps sidebar visible via left offset) -->
  <div id="mapOverlay" aria-hidden="true">
    <button id="mapCloseBtn">✕ Fechar mapa</button>
    <div id="mapContainer"></div>
  </div>

  <!-- Camera / Scanner view -->
  <div id="cameraView" aria-hidden="true">
    <video id="videoElement" autoplay playsinline muted></video>
    <div class="scan-overlay" aria-hidden="true"></div>

    <div class="scanner-controls">
      <select id="cameraSelect"><option>Carregando câmeras...</option></select>
      <button id="btnToggleFlash" title="Flash">💡</button>
      <button id="btnCloseScanner" title="Fechar">✕</button>
      <button id="btnToggleManualInput" title="Entrada Manual">✏️</button>
    </div>

    <div id="manualInputContainer" style="display:none;">
      <input id="manualInput" placeholder="Ex: BR123456789" />
      <button id="manualSave" class="btn primary">Salvar</button>
      <button id="manualCancel" class="btn secondary">Cancelar</button>
    </div>

    <div id="feedbackMsg">Pronto para escanear</div>
  </div>

  <!-- Libraries (required) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Heatmap (leaflet-heat) -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <!-- Routing (leaflet-routing-machine) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

  <!-- Your app logic -->
  <script src="app.js"></script>
</body>
</html>
