<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>📦 PegazusLog Scanner</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    /* LOGIN */
    .login-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    #loginBox {
      background: #fff;
      padding: 30px;
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #loginBox input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    #loginBtn {
      padding: 12px;
      border: none;
      background: #0077b6;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    #loginBtn:hover { background: #005f90; }

    #feedbackMessage {
      font-size: 13px;
      text-align: center;
      min-height: 18px;
    }

    /* APP */
    body.logged-in #loginScreen { display: none; }
    body.logged-in .app { display: block; }

    .app {
      display: none;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin: 0 0 15px 0;
      text-align: center;
      font-size: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #startButton { background: #00b4d8; color: #fff; }
    #stopButton, #clearBtn, #exportBtn { background: #6c757d; color: #fff; }

    .camera-wrap {
      background: #000;
      border-radius: 12px;
      height: 60vh;
      overflow: hidden;
      position: relative;
    }

    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { position: absolute; left: 0; top: 0; pointer-events: none; }

    .panel {
      margin-top: 15px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .item {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }

  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-container">
    <div id="loginBox">
      <h2 style="text-align:center; margin-bottom:5px;">🔑 Acesso ao Sistema</h2>
      <input id="loginUser" placeholder="Usuário" type="text" />
      <input id="loginPass" placeholder="Senha" type="password" />
      <button id="loginBtn">Entrar</button>
      <p id="feedbackMessage">Digite suas credenciais.</p>
    </div>
  </div>

  <!-- APP -->
  <div class="app">
    <h1>📦 PegazusLog Scanner</h1>

    <div class="controls">
      <button id="startButton">▶️ Iniciar</button>
      <button id="stopButton">⏹️ Parar</button>
      <button id="exportBtn">⬇️ Exportar</button>
      <button id="clearBtn">🧹 Limpar</button>
    </div>

    <div class="camera-wrap">
      <video id="videoElement" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="panel">
      <div id="output">Aguardando leitura...</div>
      <div id="scansList"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
