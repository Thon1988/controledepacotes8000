<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>PegazusLog — Sistema Inteligente</title>

  <!-- JSQR -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <!-- Marker Cluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

  <!-- Heatmap -->
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

  <!-- SweetAlert -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- QR Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.0.3/qrcode.min.js"></script>

  <style>
    :root{
      --bg:#0f172a; --panel:rgba(30,41,59,0.95); --text:#f1f5f9; --muted:#94a3b8;
      --content-bg-light:#f4f6f8; --content-card-bg:#fff; --content-text-dark:#1f2937;
      --accent:#38bdf8; --accent-dark:#0ea5e9; --success:#22c55e; --danger:#ef4444;
      --radius:25px;
      font-family:'Inter',sans-serif;
    }

    body{
      margin:0; background:#0f172a;
      min-height:100vh;
      display:flex; justify-content:center; align-items:center;
      color:var(--text);
    }

    .hidden{display:none!important;}

    /* -------- LOGIN -------- */
    .login-container{
      width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#0f172a;
    }
    .login-card{
      background:var(--panel);
      padding:35px;
      width:90%;max-width:380px;
      border-radius:var(--radius);
      box-shadow:0 10px 25px rgba(0,0,0,0.5);
    }
    .login-logo{
      font-size:32px;font-weight:800;color:var(--accent);
      display:flex;justify-content:center;align-items:center;
      gap:8px;margin-bottom:25px;
    }
    .login-card input{
      width:100%;padding:12px;border-radius:8px;background:#1e293b;border:1px solid #334155;
      color:white;margin-bottom:12px;font-size:16px;
    }
    .login-card button{
      width:100%;padding:12px;background:var(--accent);border:none;border-radius:10px;font-weight:bold;
      cursor:pointer;
    }

    /* -------- LAYOUT -------- */
    .app{
      display:grid;grid-template-columns:340px 1fr;
      width:100vw;height:100vh;background:var(--content-bg-light);
    }
    .sidebar{
      background:var(--panel);color:white;padding:20px;display:flex;flex-direction:column;box-shadow:4px 0 15px rgba(0,0,0,0.2);
      transition:.3s;
    }

    /* Fullscreen map hides sidebar */
    .app.fullscreen-map-active .sidebar{
      transform:translateX(-100%);
      opacity:0;pointer-events:none;
    }

    .menu-item{
      padding:12px 14px;border-radius:10px;margin-bottom:8px;background:none;cursor:pointer;color:#e2e8f0;
    }
    .menu-item:hover{background:rgba(255,255,255,0.06);}
    .menu-item.active{background:var(--accent);color:#0f172a;font-weight:800;}

    .main{
      padding:24px;overflow:auto;background:var(--content-bg-light);
    }

    /* -------- CAMERA -------- */
    #cameraView{
      position:fixed;inset:0;background:black;display:none;justify-content:center;align-items:center;z-index:999;
    }
    #videoElement{width:100%;height:100%;object-fit:cover;}
    .scan-overlay{
      position:absolute;width:80vmin;height:80vmin;border:4px solid rgba(255,255,255,0.5);border-radius:14px;
      top:50%;left:50%;transform:translate(-50%,-50%);
    }
    #feedbackMsg{
      position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
      background:var(--accent);color:#000;padding:10px 20px;border-radius:10px;
      opacity:0;
    }
    .camera-controls{
      position:absolute;top:10px;width:100%;display:flex;justify-content:space-between;padding:0 12px;
    }
    .camera-controls button{
      background:rgba(0,0,0,0.5);color:white;border:none;border-radius:50%;width:44px;height:44px;font-size:20px;
    }

    /* -------- MODAL (Manual/QR) -------- */
    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:1000;
    }
    .modal{
      background:white;color:#1f2937;width:90%;max-width:420px;padding:22px;border-radius:14px;
    }

    /* QR code container */
    #qrcodeContainer{
      display:flex;justify-content:center;padding:20px 0;
      border-top:1px solid #ddd;margin-top:10px;
    }

  </style>
</head>

<body>

<!-- ---------------- LOGIN ---------------- -->
<section id="loginSection" class="login-container">
  <div class="login-card">
    <div class="login-logo">⚡ PegazusLog</div>

    <input id="loginUser" placeholder="Usuário" value="thon">
    <input id="loginPass" type="password" placeholder="Senha" value="882010">

    <button id="btnLogin">Entrar</button>

    <p id="loginError" style="color:#f87171;margin-top:10px;"></p>
  </div>
</section>

<!-- ---------------- APP ---------------- -->
<div id="app" class="app hidden">

  <aside id="sidebar" class="sidebar">
    <div class="menu-item active" id="btnDashboard">🏠 Dashboard</div>
    <div class="menu-item" id="btnScanMode">📷 Scanner</div>
    <div class="menu-item" id="btnDeliveries">📃 Lista de Entregas</div>
    <div class="menu-item" id="btnMap">🗺️ Mapa</div>
    <div class="menu-item" id="btnRoutes">🧭 Rotas</div>
    <div class="menu-item" id="btnManualSearch">🔍 Pesquisar QR</div>

    <hr style="border-color:rgba(255,255,255,0.1);margin:12px 0;">

    <div id="adminMenu" class="">
      <div class="menu-item" id="btnUsers">👥 Usuários</div>

      <div class="menu-item" id="btnExport">⬇️ Exportar CSV</div>
    </div>

    <div style="margin-top:auto;font-size:14px;color:#94a3b8;">
      Logado como: <strong id="displayUser">?</strong>
    </div>
    <button id="btnLogout" style="margin-top:12px;padding:10px;border-radius:10px;border:none;background:#ef4444;color:white;">Sair</button>
  </aside>

  <main class="main">
    <div id="contentArea"></div>
  </main>

</div>


<!-- ---------------- CAMERA VIEW ---------------- -->
<section id="cameraView">
  <video id="videoElement" playsinline></video>
  <div class="scan-overlay"></div>

  <div class="camera-controls">
    <button id="btnCloseCamera">✕</button>

    <div style="display:flex;gap:8px;">
      <select id="cameraSelect"></select>
      <button id="btnTorch">💡</button>
      <button id="btnManual">✏️</button>
    </div>
  </div>

  <div id="feedbackMsg"></div>
</section>


<!-- ---------------- MODAL ---------------- -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Gerar / Pesquisar QR Code</h3>

    <input id="manualInput" placeholder="BR123456789">

    <div id="qrcodeContainer"></div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:15px;">
      <button id="manualCancel">Fechar</button>
      <button id="manualSave" class="btn-primary">Gerar QR</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
